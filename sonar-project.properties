# SonarQube (Cloud) project configuration file.

# Meta configuration.
sonar.projectKey=SamG101-Developer_spp
sonar.organization=samg101-developer

# Build configuration.
sonar.sources=sources,headers
sonar.tests=tests
sonar.cfamily.compile-commands=build/compile_commands.json
sonar.sourceEncoding=UTF-8
sonar.cfamily.experimental.cpp26.enabled=true

# Ignore #undefs found in wrapper module files.
sonar.issue.ignore.multicriteria=modwrap,altops,protfields,platmacros,wrapglobals
sonar.issue.ignore.multicriteria.modwrap.ruleKey=cpp:S959
sonar.issue.ignore.multicriteria.modwrap.resourceKey=**/headers/wrappers/**/*.ixx
sonar.issue.ignore.multicriteria.altops.ruleKey=cpp:S3659
sonar.issue.ignore.multicriteria.altops.resourceKey=**/*
sonar.issue.ignore.multicriteria.protfields.ruleKey=cpp:S3656
sonar.issue.ignore.multicriteria.protfields.resourceKey=**/*
sonar.issue.ignore.multicriteria.platmacros.ruleKey=cpp:S5028
sonar.issue.ignore.multicriteria.platmacros.resourceKey=**/headers/spp/macros-platforms.hpp
sonar.issue.ignore.multicriteria.wrapglobals.ruleKey=cpp:S5421
sonar.issue.ignore.multicriteria.wrapglobals.resourceKey=**/headers/wrappers/**/*.ixx
