ignoreUntil = 2027-02-18
reason = "Boost.Graph read_graphviz parser. This project includes only boost/multiprecision and boost/preprocessor, both header-only via Boost::boost, so the affected translation units are never compiled or linked. Re-evaluate if a Boost.Graph dependency is ever added."

