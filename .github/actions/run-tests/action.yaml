name: run-tests
description: "Run the gtest suite through gtest-parallel and collect per-test logs."

inputs:
  output-dir:
    description: "Directory to write per-test logs into."
    required: false
    default: "tests/test_output"
  workers:
    description: "Parallel workers; empty lets gtest-parallel pick (one per core)."
    required: false
    default: ""
  shard-count:
    description: "Total shards the sweep is split across, one job per shard."
    required: false
    default: ""
  shard-index:
    description: "Zero-indexed shard this job runs. Ignored unless shard-count is above 1."
    required: false
    default: "0"

runs:
  using: composite
  steps:
    # Cache-key versions and toolchain pins all live in ".github/dependencies.toml".
    - name: Set up Python and load pins
      uses: ./.github/actions/setup-python

    - name: Cache gtest-parallel
      id: gtp-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}/gtest-parallel
        key: gtest-parallel-${{ runner.os }}-${{ runner.arch }}-${{ env.GTEST_PARALLEL_COMMIT }}

    - name: Fetch gtest-parallel (cache miss)
      if: steps.gtp-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash .github/scripts/run-tests/install-gtest-parallel.sh

    - name: Run tests
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
        WORKERS: ${{ inputs.workers }}
        SHARD_COUNT: ${{ inputs.shard-count }}
        SHARD_INDEX: ${{ inputs.shard-index }}
      run: bash .github/scripts/run-tests/run-tests.sh
