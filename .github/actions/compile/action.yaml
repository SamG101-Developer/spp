name: compile
description: "Configure, build, test and optionally stage the compiler for one toolchain/variant."

# Every input arrives as a string, so flags are compared against a literal rather than tested for truthiness:
# `if: inputs.run-tests` is true for the string "false".

inputs:
  variant:
    description: "Build variant name; names the build tree's cache entry and the job's artefacts."
    required: true
  build-type:
    description: "CMake build type (Release | RelWithDebInfo | Debug)."
    required: true
  sanitizer:
    description: "Sanitizers to instrument the compiler with, e.g. `address+undefined+leak`. Empty for none."
    required: false
    default: ""
  spp-mode:
    description: "Optimisation pipeline the built compiler runs over the s++ fixtures (dev | rel)."
    required: false
    default: "rel"
  shard-count:
    description: "Total shards this variant's test sweep is split across, one job per shard."
    required: false
    default: "1"
  shard-index:
    description: >-
      Zero-indexed shard this job runs. Shard 0 saves the build tree and stages the binary, so a sharded
      variant still writes each exactly once.
    required: false
    default: "0"
  stl-conformance:
    description: "Run the end-to-end `spp init` / `spp build` / `spp test --all-libs` sweep before the gtest suite."
    required: false
    default: "false"
  os:
    description: "Runner image; one of the images listed under [runner] in .github/dependencies.toml."
    required: false
    default: "ubuntu-24.04"
  compiler:
    description: "Compiler (gcc | clang | msvc | clang-cl). Its version comes from the manifest."
    required: false
    default: "gcc"
  run-tests:
    description: "Run the test suite after a successful build."
    required: false
    default: "true"
  binary-artifact:
    description: "Upload the built `spp` executable under this artifact name, renamed to match. Empty keeps nothing."
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Once per job: every action below reads the pins this publishes.
    - name: Set up Python and load pins
      uses: ./.github/actions/setup-python

    # A composite action cannot carry a job-level `env`, so the block is exported once here instead.
    - name: Export build environment
      shell: bash
      env:
        COMPILER: ${{ inputs.compiler }}
        SPP_MODE: ${{ inputs.spp-mode }}
        SHARD_COUNT: ${{ inputs.shard-count }}
        SHARD_INDEX: ${{ inputs.shard-index }}
      run: bash .github/scripts/compile/export-env.sh

    - name: Set up toolchain
      uses: ./.github/actions/setup-toolchain
      with:
        runner-image: ${{ inputs.os }}
        compiler: ${{ inputs.compiler }}
        version: ${{ env.SPP_TOOLCHAIN_VERSION }}
        cache-key-suffix: ${{ inputs.variant }}

    - name: Restore source mtimes
      uses: ./.github/actions/restore-mtimes

    # The key is composed by the shared action rather than spelled out here, so the workflows that write the tree
    # and the ones that read it cannot drift apart.
    - name: Compose build tree cache key
      id: cache-key
      uses: ./.github/actions/build-cache-key
      with:
        os: ${{ inputs.os }}
        compiler: ${{ inputs.compiler }}
        version: ${{ env.SPP_TOOLCHAIN_VERSION }}
        variant: ${{ inputs.variant }}

    # Falls back to the newest tree for this variant on this branch, then on the base branch.
    - name: Restore build tree
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: build
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: ${{ steps.cache-key.outputs.prefix }}

    - name: Configure
      id: configure
      uses: ./.github/actions/configure-cmake
      with:
        build-type: ${{ inputs.build-type }}
        sanitizer: ${{ inputs.sanitizer }}

    # Teed so a failed build can be uploaded whole.
    - name: Build
      id: build
      shell: bash
      run: |
        mkdir -p build-logs
        cmake --build build --parallel 2>&1 | tee build-logs/build.log

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: buildlog-${{ inputs.os }}-${{ inputs.compiler }}-${{ inputs.variant }}${{ env.SPP_SHARD_SUFFIX }}
        path: build-logs
        if-no-files-found: ignore
        retention-days: 3

    # A tree whose configure failed is worse than no tree: its cached check results come back on every later run.
    - name: Save build tree
      if: ${{ always() && steps.configure.outcome == 'success' && inputs.shard-index == '0' }}
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: build
        key: ${{ steps.cache-key.outputs.key }}

    # Named on the way out, so the artifact and the file inside it carry the same release-identifying name and the
    # publish step can attach them without a rename.
    - name: Stage and upload binary
      if: inputs.binary-artifact != '' && inputs.shard-index == '0'
      shell: bash
      env:
        ARTIFACT: ${{ inputs.binary-artifact }}
      run: |
        mkdir -p staged
        if [ "$RUNNER_OS" = "Windows" ]; then
          cp build/spp.exe "staged/${ARTIFACT}.exe"
        else
          cp build/spp "staged/${ARTIFACT}"
        fi

    - name: Upload binary
      if: inputs.binary-artifact != '' && inputs.shard-index == '0'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ inputs.binary-artifact }}
        path: staged
        if-no-files-found: error
        retention-days: 7

    # `spp init` / `spp build` / `spp test --all-libs` covers the STL, which the gtest suite never links or executes.
    # This and the gtest step gate on the build, not on each other, so a red STL cannot hide the compiler's results.
    - name: s++ STL conformance
      if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.run-tests == 'true' && inputs.stl-conformance == 'true' }}
      shell: bash
      run: bash .github/scripts/stl-conformance/run.sh

    - name: Run tests
      id: tests
      if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.run-tests == 'true' }}
      uses: ./.github/actions/run-tests
      with:
        shard-count: ${{ inputs.shard-count }}
        shard-index: ${{ inputs.shard-index }}

    - name: Upload test logs on failure
      if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: testlog-${{ inputs.os }}-${{ inputs.compiler }}-${{ inputs.variant }}${{ env.SPP_SHARD_SUFFIX }}
        path: tests/test_output
        if-no-files-found: ignore
        retention-days: 3
