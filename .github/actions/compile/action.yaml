name: compile
description: "Configure, build and optionally stage the compiler for one toolchain/variant."

# Build only; the tests run in _lane.yaml.
#
# Every input arrives as a string, so flags are compared against a literal rather than tested for truthiness:
# `if: inputs.stage` is true for the string "false".

inputs:
  variant:
    description: "Build variant name; names the build tree's cache entry and the job's artefacts."
    required: true
  build-type:
    description: "CMake build type (Release | RelWithDebInfo | Debug)."
    required: true
  os:
    description: "Runner image; one of the images listed under [runner] in .github/dependencies.toml."
    required: false
    default: "ubuntu-24.04"
  compiler:
    description: "Compiler (gcc | clang | msvc | clang-cl). Its version comes from the manifest."
    required: false
    default: "gcc"
  cmake-flags:
    description: "Extra CMake flags, e.g. `-DSPP_ALL_TARGETS=ON`. Give such a build its own variant name."
    required: false
    default: ""
  stage:
    description: >-
      Upload `spp`, and `spp_tests` when the build has tests, for the test jobs that follow; their digests and the
      artifact's name become outputs.
    required: false
    default: "false"

outputs:
  artifact:
    description: "Name of the staged binaries artifact; empty unless stage is 'true'."
    value: ${{ steps.stage.outputs.artifact }}
  spp-sha256:
    description: "sha256 of the staged spp; empty unless stage is 'true'."
    value: ${{ steps.stage.outputs.spp-sha256 }}
  tests-sha256:
    description: "sha256 of the staged spp_tests; empty unless the staged build has tests."
    value: ${{ steps.stage.outputs.tests-sha256 }}

runs:
  using: composite
  steps:
    # Once per job: every action below reads the pins this publishes.
    - name: Set up Python and load pins
      uses: ./.github/actions/setup-python

    # A composite action cannot carry a job-level `env`, so the version is exported once here instead.
    - name: Export build environment
      shell: bash
      env:
        COMPILER: ${{ inputs.compiler }}
      run: bash .github/scripts/build/export-env.sh

    - name: Set up toolchain
      uses: ./.github/actions/setup-toolchain
      with:
        runner-image: ${{ inputs.os }}
        compiler: ${{ inputs.compiler }}
        version: ${{ env.SPP_TOOLCHAIN_VERSION }}
        cache-key-suffix: ${{ inputs.variant }}

    - name: Restore source mtimes
      uses: ./.github/actions/restore-mtimes

    # The key is composed by the shared action rather than spelled out here, so the workflows that write the tree
    # and the ones that read it cannot drift apart.
    - name: Compose build tree cache key
      id: cache-key
      uses: ./.github/actions/build-cache-key
      with:
        os: ${{ inputs.os }}
        compiler: ${{ inputs.compiler }}
        version: ${{ env.SPP_TOOLCHAIN_VERSION }}
        variant: ${{ inputs.variant }}

    # Falls back to the newest tree for this variant on this branch, then on the base branch.
    - name: Restore build tree
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: build
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: ${{ steps.cache-key.outputs.prefix }}

    - name: Configure
      id: configure
      uses: ./.github/actions/configure-cmake
      with:
        build-type: ${{ inputs.build-type }}
        extra-flags: ${{ inputs.cmake-flags }}

    - name: Build
      shell: bash
      run: bash .github/scripts/build/build.sh

    # Test jobs have no toolchain, so a binary that needs one of its libraries fails here, by name.
    - name: Check binaries are self-contained
      shell: bash
      run: bash .github/scripts/build/check-self-contained.sh

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: buildlog-${{ inputs.os }}-${{ inputs.compiler }}-${{ inputs.variant }}
        path: build-logs
        if-no-files-found: ignore
        retention-days: 3

    # A tree whose configure failed is worse than no tree: its cached check results come back on every later run.
    - name: Save build tree
      if: ${{ always() && steps.configure.outcome == 'success' }}
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: build
        key: ${{ steps.cache-key.outputs.key }}

    - name: Stage binaries for the test jobs
      id: stage
      if: inputs.stage == 'true'
      shell: bash
      env:
        STAGE_OS: ${{ inputs.os }}
        STAGE_COMPILER: ${{ inputs.compiler }}
        STAGE_VARIANT: ${{ inputs.variant }}
      run: bash .github/scripts/build/stage-binaries.sh

    # One day: this run's test jobs, and on a release its collect job, are the only readers.
    - name: Upload binaries for the test jobs
      if: inputs.stage == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.stage.outputs.artifact }}
        path: staged-bin
        if-no-files-found: error
        retention-days: 1
