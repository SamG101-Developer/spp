name: restore-mtimes
description: "Rewrite tracked files' mtimes from commit history so cached build trees stay usable."

runs:
  using: composite
  steps:
    # The interpreter only; this action runs before the pins are needed and does not use them.
    - name: Set up Python
      uses: ./.github/actions/setup-python
      with:
        load-versions: "false"

    - name: Restore source mtimes
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/restore_mtimes.py"
