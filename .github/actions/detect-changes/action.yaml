name: detect-changes
description: "Decide, per gated CI job, whether this ref changed anything that can affect that job's result."

inputs:
  base:
    description: "Commit to diff from. Empty, all-zeroes or unreachable means 'assume everything changed'."
    required: false
    default: ""
  head:
    description: "Commit to diff to."
    required: false
    default: ${{ github.sha }}

outputs:
  code:
    description: "'true' when a source, build-system, toolchain-pin or test-data path changed."
    value: ${{ steps.classify.outputs.code }}
  ci_pins_only:
    description: "'true' when every change in the diff is a pinned `uses:` bump."
    value: ${{ steps.classify.outputs.ci_pins_only }}
  release_gate:
    description: "'true' when the diff has to carry a version bump and a changelog entry."
    value: ${{ steps.classify.outputs.release_gate }}
  version:
    description: "'true' when VERSION changed, i.e. the diff bumped the release version."
    value: ${{ steps.classify.outputs.version }}
  cppcheck:
    description: "'true' when the static analysis job has to run."
    value: ${{ steps.classify.outputs.cppcheck }}
  compile:
    description: "'true' when the build/test jobs have to run."
    value: ${{ steps.classify.outputs.compile }}
  cross_codegen:
    description: "'true' when the cross-codegen job has to run."
    value: ${{ steps.classify.outputs.cross_codegen }}
  security:
    description: "'true' when the security jobs have to run."
    value: ${{ steps.classify.outputs.security }}
  sonar:
    description: "'true' when the Sonar job has to run."
    value: ${{ steps.classify.outputs.sonar }}

runs:
  using: composite
  steps:
    - name: Classify the diff
      id: classify
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base }}
        HEAD_SHA: ${{ inputs.head }}
      run: bash .github/scripts/detect-changes/classify.sh
