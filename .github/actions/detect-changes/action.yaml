name: detect-changes
description: "Decide whether this ref changed anything that can affect a build, test or analysis result."

inputs:
  base:
    description: "Commit to diff from. Empty, all-zeroes or unreachable means 'assume everything changed'."
    required: false
    default: ""
  head:
    description: "Commit to diff to."
    required: false
    default: ${{ github.sha }}

outputs:
  code:
    description: "'true' when a source, build-system or test-data path changed."
    value: ${{ steps.filter.outputs.code }}
  cppcheck:
    description: "'true' when `code` is true, or a CI path the static analysis job reads changed."
    value: ${{ steps.filter.outputs.cppcheck }}
  compile:
    description: "'true' when `code` is true, or a CI path the build/test job reads changed."
    value: ${{ steps.filter.outputs.compile }}
  cross_codegen:
    description: "'true' when `code` is true, or a CI path the cross-codegen job reads changed."
    value: ${{ steps.filter.outputs.cross_codegen }}
  security:
    description: "'true' when `code` is true, or a CI path the security job reads changed."
    value: ${{ steps.filter.outputs.security }}
  sonar:
    description: "'true' when `code` is true, or a CI path the Sonar job reads changed."
    value: ${{ steps.filter.outputs.sonar }}

runs:
  using: composite
  steps:
    - name: Filter changed paths
      id: filter
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base }}
        HEAD_SHA: ${{ inputs.head }}
      run: bash .github/scripts/detect-changes/filter-changed-paths.sh
