name: build-and-plan
description: "Plan a lane's test matrix, then build and stage the compiler for it."

# The build job of every lane workflow (_lane.yaml, _coverage.yaml, _cross_codegen.yaml) after its checkout, which has
# to be in the job: this action is read from it.
#
# Every input arrives as a string, so flags are compared against a literal rather than tested for truthiness.

inputs:
  os:
    description: "Runner image; one listed under [runner] in .github/dependencies.toml."
    required: false
    default: "ubuntu-24.04"
  compiler:
    description: "Compiler (gcc | clang | msvc | clang-cl); its version comes from the manifest."
    required: false
    default: "gcc"
  variant:
    description: "Names the build tree's cache entry. Sonar restores it by this name."
    required: false
    default: "release"
  build-type:
    description: "CMake build type (Release | RelWithDebInfo | Debug)."
    required: false
    default: "Release"
  cmake-flags:
    description: "Extra CMake flags for the build, e.g. sanitizers. Give such a build its own variant."
    required: false
    default: ""
  check-floor:
    description: "Fail the build when its binaries need a newer system than [floor] in .github/dependencies.toml."
    required: false
    default: "false"
  coverage:
    description: "Build with SPP_COVERAGE (clang only), for _coverage.yaml."
    required: false
    default: "false"
  modes:
    description: "Space-separated s++ modes (rel | dev) the gtest suite runs in, each against the same build."
    required: false
    default: "rel"
  shard-count:
    description: "Jobs each mode's gtest sweep is split across."
    required: false
    default: "1"
  stl-conformance:
    description: "Run `spp init` / `spp build` / `spp test --all-libs` against the build."
    required: false
    default: "true"
  valgrind:
    description: "Run chosen `!test` groups under valgrind (Linux only; advisory)."
    required: false
    default: "false"
  codegen:
    description: "Run the tests/codegen hardening checks against the build (Linux only; advisory)."
    required: false
    default: "false"
  differential:
    description: "Run the tests/differential programs at dev and rel and compare them (Linux only; advisory)."
    required: false
    default: "false"
  pack:
    description: "Run STL conformance, valgrind, the codegen checks and the differential suite in the last gtest cell, in parallel with it, rather than in cells of their own."
    required: false
    default: "true"

outputs:
  tests:
    description: "The test matrix, as JSON."
    value: ${{ steps.plan.outputs.tests }}
  artifact:
    description: "Name of the staged binaries artifact."
    value: ${{ steps.compile.outputs.artifact }}
  spp-sha256:
    description: "sha256 of the staged spp."
    value: ${{ steps.compile.outputs.spp-sha256 }}
  tests-sha256:
    description: "sha256 of the staged spp_tests; empty when the build has no tests."
    value: ${{ steps.compile.outputs.tests-sha256 }}

runs:
  using: composite
  steps:
    - name: Plan the tests
      id: plan
      shell: bash
      env:
        OS: ${{ inputs.os }}
        MODES: ${{ inputs.modes }}
        SHARD_COUNT: ${{ inputs.shard-count }}
        STL: ${{ inputs.stl-conformance }}
        VALGRIND: ${{ inputs.valgrind }}
        CODEGEN: ${{ inputs.codegen }}
        DIFFERENTIAL: ${{ inputs.differential }}
        PACK: ${{ inputs.pack }}
      run: bash .github/scripts/test/plan-tests.sh

    - name: Build
      id: compile
      uses: ./.github/actions/compile
      with:
        os: ${{ inputs.os }}
        compiler: ${{ inputs.compiler }}
        variant: ${{ inputs.variant }}
        build-type: ${{ inputs.build-type }}
        cmake-flags: ${{ inputs.cmake-flags }}${{ inputs.coverage == 'true' && ' -DSPP_COVERAGE=ON' || '' }}
        check-floor: ${{ inputs.check-floor }}
        stage: true
