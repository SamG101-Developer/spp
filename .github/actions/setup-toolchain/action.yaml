name: setup-toolchain
description: "Install the compiler, CMake, Ninja, the compiler cache and the project's dependencies for this runner."

# Every caller runs ./.github/actions/setup-python first: the pins this reads are published there, and an action's
# `with:` is evaluated before any of its steps run.

inputs:
  runner-image:
    description: "Runner image."
    required: true
  compiler:
    description: "Compiler family to install: gcc, clang, msvc or clang-cl."
    required: true
  version:
    description: "Compiler version: a major, or a full release for GCC on Linux; empty means the runner default."
    required: false
    default: ""
  compiler-cache:
    description: >-
      Install and restore ccache/sccache. 'false' for CodeQL: a cache hit skips the real compiler, so the extractor
      never sees the translation unit and the database comes out incomplete - a green scan over unanalysed code.
    required: false
    default: "true"
  cache-key-suffix:
    description: "Extra text folded into the compiler-cache key, so variants do not share a cache."
    required: false
    default: ""
  dependencies:
    description: "Install the project's third-party dependencies. 'false' for jobs that never configure CMake."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Runner images ship an older CMake (3.31.x); the project needs the pinned one to satisfy cmake_minimum_required.
    - name: Install CMake & Ninja
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb
      with:
        cmakeVersion: ${{ env.CMAKE_VERSION }}
        ninjaVersion: ${{ env.NINJA_VERSION }}

    # Compiler.
    - name: Fetch llvm.sh (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: bash .github/scripts/setup-toolchain/fetch-llvm-sh.sh

    - name: Install GCC (Linux)
      if: inputs.compiler == 'gcc' && runner.os == 'Linux'
      shell: bash
      env:
        GCC_VERSION: ${{ inputs.version }}
      run: bash .github/scripts/setup-toolchain/install-gcc-linux.sh

    - name: Install Clang (Linux)
      if: inputs.compiler == 'clang' && runner.os == 'Linux'
      shell: bash
      env:
        CLANG_VERSION: ${{ inputs.version }}
      run: bash .github/scripts/setup-toolchain/install-clang-linux.sh

    - name: Select Xcode (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        SPP_RUNNER_IMAGE: ${{ inputs.runner-image }}
      run: bash .github/scripts/setup-toolchain/select-xcode-macos.sh

    - name: Set up MSVC / clang-cl (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

    - name: Select Windows compiler
      if: runner.os == 'Windows'
      shell: bash
      env:
        COMPILER: ${{ inputs.compiler }}
      run: bash .github/scripts/setup-toolchain/select-windows-compiler.sh

    - name: Install compiler cache
      if: inputs.compiler-cache == 'true'
      shell: bash
      run: bash .github/scripts/setup-toolchain/compiler-cache.sh on

    - name: Cache compiler cache
      if: inputs.compiler-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.ccache
          ~/.cache/sccache
        key: cc-${{ inputs.runner-image }}-${{ inputs.compiler }}-${{ inputs.version }}-${{ inputs.cache-key-suffix }}-${{ github.sha }}
        restore-keys: |
          cc-${{ inputs.runner-image }}-${{ inputs.compiler }}-${{ inputs.version }}-${{ inputs.cache-key-suffix }}-

    - name: Disable compiler cache
      if: inputs.compiler-cache != 'true'
      shell: bash
      run: bash .github/scripts/setup-toolchain/compiler-cache.sh off

    # Project dependencies. Boost and LLVM are the awkward two to build, so both come prebuilt.
    - name: Install Boost (prebuilt)
      if: inputs.dependencies == 'true'
      shell: bash
      env:
        SPP_RUNNER_IMAGE: ${{ inputs.runner-image }}
      run: bash .github/scripts/setup-toolchain/install-boost.sh

    # CMAKE_LINKER_TYPE=LLD makes GCC pass -fuse-ld=lld, and GCC only looks for a plain 'ld.lld' on PATH.
    - name: Install LLVM dev libraries and ld.lld (Linux)
      if: inputs.dependencies == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        bash .github/scripts/setup-toolchain/install-llvm-linux.sh
        bash .github/scripts/setup-toolchain/expose-lld-linux.sh

    # Windows gets the official clang+llvm release tarball, which ships the static libs and lib/cmake/llvm that
    # find_package(LLVM) needs, plus the three libraries that release's exported targets name and the image lacks.
    - name: Cache LLVM dev libraries (Windows)
      if: inputs.dependencies == 'true' && runner.os == 'Windows'
      id: llvm-win-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/llvm
        key: llvm-win-${{ env.LLVM_WIN_SHA256 }}

    - name: Install LLVM dev libraries (Windows, cache miss)
      if: inputs.dependencies == 'true' && runner.os == 'Windows' && steps.llvm-win-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash .github/scripts/setup-toolchain/install-llvm-windows.sh

    - name: Cache the Windows-only dependencies
      if: inputs.dependencies == 'true' && runner.os == 'Windows'
      id: llvm-deps-win-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/llvm-deps
        key: llvm-deps-win-${{ hashFiles('.github/dependencies.toml', '.github/scripts/setup-toolchain/install-llvm-deps-windows.sh') }}

    - name: Install the Windows-only dependencies (cache miss)
      if: inputs.dependencies == 'true' && runner.os == 'Windows' && steps.llvm-deps-win-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash .github/scripts/setup-toolchain/install-llvm-deps-windows.sh

    # macOS takes its compiler out of the same release: brew has no llvm@23, so a brew clang would be a whole major
    # version behind the LLVM the project links against. The key carries the install script, which decides what the
    # tree holds and so cannot change without invalidating what is already cached.
    - name: Cache LLVM toolchain (macOS)
      if: inputs.dependencies == 'true' && runner.os == 'macOS'
      id: llvm-mac-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/llvm
        key: llvm-mac-${{ env.LLVM_MAC_SHA256 }}-${{ hashFiles('.github/scripts/setup-toolchain/install-llvm-macos.sh') }}

    - name: Install LLVM toolchain (macOS, cache miss)
      if: inputs.dependencies == 'true' && runner.os == 'macOS' && steps.llvm-mac-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash .github/scripts/setup-toolchain/install-llvm-macos.sh

    - name: Select Clang (macOS)
      if: inputs.dependencies == 'true' && inputs.compiler == 'clang' && runner.os == 'macOS'
      shell: bash
      env:
        CLANG_VERSION: ${{ inputs.version }}
      run: bash .github/scripts/setup-toolchain/install-clang-macos.sh

    # The remaining libraries are header/CMake projects: check out, install, cache. The key is content-addressed on
    # the files that decide what the tree contains and where it goes.
    - name: Restore small libraries
      if: inputs.dependencies == 'true'
      id: libs-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.local
        key: spp-libs-v2-${{ inputs.runner-image }}-${{ inputs.compiler }}${{ inputs.version }}-${{ hashFiles('.github/scripts/setup-toolchain/install-small-libs.sh', '.github/scripts/lib/pins.py') }}-${{ hashFiles('.github/dependencies.toml') }}
        restore-keys: |
          spp-libs-v2-${{ inputs.runner-image }}-${{ inputs.compiler }}${{ inputs.version }}-${{ hashFiles('.github/scripts/setup-toolchain/install-small-libs.sh', '.github/scripts/lib/pins.py') }}-

    # A restored tree is only usable if the install that filled it ran to the end; a half-installed prefix otherwise
    # looks like a hit forever and every find_package() past the missing library fails.
    - name: Check small libraries
      if: inputs.dependencies == 'true'
      id: libs-check
      shell: bash
      run: bash .github/scripts/setup-toolchain/check-small-libs.sh

    - name: Clone & install small libraries (cache miss or partial tree)
      if: inputs.dependencies == 'true' && steps.libs-check.outputs.complete != 'true'
      shell: bash
      run: bash .github/scripts/setup-toolchain/install-small-libs.sh

    # Only after the install succeeded: a save on the combined action runs from the post step, which is also reached
    # when the install failed.
    - name: Save small libraries
      if: inputs.dependencies == 'true' && steps.libs-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.local
        key: ${{ steps.libs-cache.outputs.cache-primary-key }}

    - name: Expose dependency prefixes
      if: inputs.dependencies == 'true'
      shell: bash
      run: bash .github/scripts/setup-toolchain/expose-prefixes.sh
