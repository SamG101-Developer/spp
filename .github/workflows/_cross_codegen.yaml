name: cross-codegen

# Prove the compiler can emit for a target that is not the one it is running on. This is code generation only: the
# object is emitted and inspected, never linked or executed. Linking a foreign object needs a cross linker and a
# cross-built sppc runtime, and the runtime a project ships is a host binary, so there is nothing here to link against.

on:
  workflow_call:
    inputs:
      os:
        description: "Runner image to emit from; the host, which is deliberately none of the targets."
        required: false
        type: string
        default: "ubuntu-24.04"

permissions: { }

jobs:
  cross-codegen:
    name: ${{ matrix.target.triple }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - { triple: "i686-unknown-linux-gnu", arch: "Intel 80386", layout: "p:32:32" }
          - { triple: "s390x-unknown-linux-gnu", arch: "IBM S/390", layout: "E-S64-m:e" }
          - { triple: "riscv64-unknown-linux-gnu", arch: "RISC-V", layout: "p:64:64" }
          - { triple: "aarch64-unknown-linux-gnu", arch: "ARM aarch64", layout: "i8:8:32" }
          - { triple: "x86_64-unknown-linux-musl", arch: "x86-64", layout: "e-m:e" }


    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore source mtimes
        uses: ./.github/actions/restore-mtimes

      - name: Set up Python and load pins
        uses: ./.github/actions/setup-python

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          runner-image: ${{ inputs.os }}
          compiler: gcc
          version: ${{ env.GCC_VERSION }}
          cache-key-suffix: cross

      # Its own family: SPP_ALL_TARGETS changes what is linked in, so this tree cannot be shared with the ordinary
      # build, and it has one configuration rather than a variant list.
      - name: Compose build tree cache key
        id: cache-key
        uses: ./.github/actions/build-cache-key
        with:
          family: cross
          os: ${{ inputs.os }}
          compiler: gcc

      - name: Restore build tree
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}

      # SPP_ALL_TARGETS links every backend this llvm has, which
      # is what "--target" needs and what an ordinary build
      # deliberately does not pay for. No unit tests.
      - name: Configure
        id: configure
        uses: ./.github/actions/configure-cmake
        with:
          build-type: Release
          extra-flags: "-DSPP_ALL_TARGETS=ON -DSPP_BUILD_TESTS=OFF"

      - name: Build
        run: cmake --build build --parallel --target spp

      - name: Save build tree
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build
          key: ${{ steps.cache-key.outputs.key }}

      - name: Emit and check ${{ matrix.target.triple }}
        run: >-
          bash .github/scripts/cross-codegen/check-target.sh
          '${{ matrix.target.triple }}'
          '${{ matrix.target.arch }}'
          '${{ matrix.target.layout }}'

      - name: Upload emitted IR on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cross-ir-${{ matrix.target.triple }}
          path: project/out/${{ matrix.target.triple }}/rel/llvm/lto.ll
          if-no-files-found: ignore
          retention-days: 3
