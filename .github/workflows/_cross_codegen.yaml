# Prove the compiler can emit for a target that is not the
# one it is running on. This is code generation only: the
# object is emitted and inspected, never linked or executed.
# Linking a foreign object needs a cross linker and a cross-
# built sppc runtime, and the runtime a project ships is a
# host binary, so there is nothing to link against.


name: cross-codegen

on:
  workflow_call:
    inputs:
      os:
        description: "Runner image to emit from; the host, which is deliberately none of the targets."
        required: false
        type: string
        default: "ubuntu-24.04"

permissions: { }

jobs:
  build:
    name: build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.compile.outputs.artifact }}
      spp-sha256: ${{ steps.compile.outputs.spp-sha256 }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit

      # Full history: restore-mtimes walks it to date the sources
      # for the incremental build.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # SPP_ALL_TARGETS links every backend, which `--target` needs;
      # its own variant keeps the tree apart.
      - name: Build
        id: compile
        uses: ./.github/actions/compile
        with:
          os: ${{ inputs.os }}
          compiler: gcc
          variant: all-targets
          build-type: Release
          cmake-flags: "-DSPP_ALL_TARGETS=ON -DSPP_BUILD_TESTS=OFF"
          stage: true

  emit:
    name: emit ${{ matrix.target.triple }}
    needs: [ build ]
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - { triple: "i686-unknown-linux-gnu", arch: "Intel (80386|i386)", layout: "p:32:32" }
          - { triple: "s390x-unknown-linux-gnu", arch: "IBM S/390", layout: "E-S64-m:e" }
          - { triple: "riscv64-unknown-linux-gnu", arch: "RISC-V", layout: "p:64:64" }
          - { triple: "aarch64-unknown-linux-gnu", arch: "ARM aarch64", layout: "i8:8:32" }
          - { triple: "x86_64-unknown-linux-musl", arch: "x86-64", layout: "e-m:e" }
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Setup the runtime by downloading a binary artefact to run
      # and verifying its integrity.
      - name: Fetch and verify spp
        uses: ./.github/actions/setup-runtime
        with:
          artifact: ${{ needs.build.outputs.artifact }}
          spp-sha256: ${{ needs.build.outputs.spp-sha256 }}

      # Emit the codegen for a cross-compiled target and check it
      # is for the correct target.
      - name: Emit and check ${{ matrix.target.triple }}
        id: emit
        run: >-
          bash .github/scripts/test/cross-codegen.sh
          '${{ matrix.target.triple }}'
          '${{ matrix.target.arch }}'
          '${{ matrix.target.layout }}'

      # Upload the emitted IR on failure, so it can be inspected.
      - name: Upload emitted IR on failure
        if: failure() && steps.emit.outputs.ir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cross-ir-${{ matrix.target.triple }}
          path: ${{ steps.emit.outputs.ir }}
          if-no-files-found: ignore
          retention-days: 3
