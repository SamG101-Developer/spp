name: lint

# The two inexpensive gates, run side by side. Both must pass before anything expensive starts, so a malformed PR title
# costs seconds rather than a full compilation. Check the pr title and description for simple uniform conformance rules.

on:
  workflow_call: { }

permissions: { }

jobs:
  # The PR title must have the common format of "type: summary", and the description must be all lowercase, with simple
  # punctuation.
  pr-title:
    name: PR Title Format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: read
    steps:
      # Secure the runner from external packages or actions.
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      # Enforce the regex rules on the PR title and description.
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            core
          requireScope: false
          subjectPattern: '^[a-z][a-z0-9 .-]*$'
          subjectPatternError: "The description must match the regex."

  # The "pre-commit" step runs the pre-commit-config.yaml file, which runs the simple linting such as missing or extra
  # newlines, whitespace, yaml/toml/jaon/action checks, cmake formatting, etc.
  pre-commit:
    name: Format & Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      # Secure the runner from external packages or actions.
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
          disable-sudo: true

      # Provide the ability to git-checkout external packages and actions.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Installs the pinned Python that pre-commit itself runs under, and publishes the pins.
      - name: Set up Python and load pins
        uses: ./.github/actions/setup-python

      # Run the pre-commit steps.
      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd
