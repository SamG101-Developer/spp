name: PR Title

# Standalone, because a title can change without the commit
# changing and so this has to run on `edited`. Its own required
# status check - add "PR Title Format" to branch protection
# alongside "CI Success".

on:
  pull_request:
    types: [ opened, edited, reopened ]

permissions: { }

# Keyed on the pull request rather than the ref: consecutive
# edits supersede each other, and cancelling this costs
# nothing because it takes seconds.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Main job, checking the PR title. There is an exemption,
  # as Dependabot's titles are capitalised, so ignore. A
  # skipped job still satisfies the required check.
  pr-title:
    name: PR Title Format
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      # https://github.com/amannn/action-semantic-pull-request
      # Use this action to enforce semantic pull request titles,
      # and a fully lowercase (uniform) description.
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            core
          requireScope: false
          subjectPattern: '^[a-z][a-z0-9 ./:-]*$'
          subjectPatternError: "The description must match the regex."
