name: Post-merge

# The "post-merge" workflow consists of two jobs: publish the site, and rebuild master so its build-tree caches are
# fresh. The second part is important as GitHub only lets a PR branch read caches from its own branch and from the base
# branch, so a warm master is what lets a brand-new PR compile incrementally. As this is post-merge, it doesn't slow
# down the merge process or act as a blocker.

on:
  push:
    branches: [ master ]
  workflow_dispatch: { }

permissions: { }

concurrency:
  group: post-merge
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Code Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      compile: ${{ steps.filter.outputs.compile }}
      sonar: ${{ steps.filter.outputs.sonar }}
    steps:
      # Secure the runner from external packages or actions.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      # Provide the ability to git-checkout external packages and actions.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Full history so the before..sha diff below can be resolved. Nothing is built here, so the mtime pass is not
      # needed.
      - name: Detect changed paths
        id: filter
        uses: ./.github/actions/detect-changes
        with:
          base: ${{ github.event.before }}
          head: ${{ github.sha }}

  docs:
    name: Docs
    permissions:
      contents: read
    uses: ./.github/workflows/_docs.yaml
    with:
      upload-pages-artifact: true

  publish-docs:
    name: Publish Docs
    needs: [ docs ]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write     # deploy the built site
      id-token: write  # the Pages deployment is authenticated with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

  # Doubles as the master health check and as the cache warmer. The variant list must stay identical to the PR
  # pipeline's: the build-cache-key action folds `variant.name` in, so a variant missing here is a variant that compiles
  # from cold on every PR. fail-fast is off for the same reason - one red variant must not cost the others their cache.
  build-test:
    name: Build & Test
    needs: [ changes ]
    if: needs.changes.outputs.compile == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_compile.yaml
    with:
      os: ubuntu-24.04
      compiler: gcc
      version: "16"
      fail-fast: false
      variants: >-
        [
          {"name": "release-rel", "build-type": "Release", "sanitizer": "", "spp-mode": "rel"},
        ]

  # Ordered after `build-test` so it restores that run's exact-sha tree and only has to re-run the configure step,
  # rather than racing it and falling back to the previous commit's.
  sonar:
    name: Sonar
    needs: [ changes, build-test ]
    if: |
      !cancelled()
      && needs.changes.outputs.sonar == 'true'
      && !contains(fromJSON('["failure", "cancelled"]'), needs['build-test'].result)
    permissions:
      contents: read
    uses: ./.github/workflows/_sonar.yaml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
