name: Post-merge

# Publishes the site, rebuilds master so its build-tree caches are fresh, and cuts the release for the version the
# merged PR bumped to. The cache part matters: a PR branch can only read caches from itself and from the base
# branch, so a warm master is what lets a brand-new PR compile incrementally.

on:
  push:
    branches: [ master ]
  workflow_dispatch: { }

permissions: { }

concurrency:
  group: post-merge
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Code Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ci_pins_only: ${{ steps.filter.outputs.ci_pins_only }}
      compile: ${{ steps.filter.outputs.compile }}
      sonar: ${{ steps.filter.outputs.sonar }}
      version: ${{ steps.filter.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      # Full history so the before..sha diff can be resolved.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        uses: ./.github/actions/detect-changes
        with:
          base: ${{ github.event.before }}
          head: ${{ github.sha }}

  docs:
    name: Docs
    needs: [ changes ]
    if: needs.changes.outputs.ci_pins_only != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_docs.yaml
    with:
      upload-pages-artifact: true

  publish-docs:
    name: Publish Docs
    needs: [ docs ]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write     # deploy the built site
      id-token: write  # the Pages deployment is authenticated with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  # Doubles as the master health check and as the cache warmer, which is why it is the same workflow the PR pipeline
  # runs: a variant missing here is a variant that compiles from cold on every PR.
  build-test:
    name: Build & Test
    needs: [ changes ]
    if: needs.changes.outputs.compile == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yaml

  # Only a push that bumped VERSION, or a manual dispatch, is a release candidate. Without this an unpublished
  # version is retried by every later push. The tag check then stops a re-run of the same push from building a second
  # set of binaries for a version that is already published.
  release-gate:
    name: Release Gate
    needs: [ changes ]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.version == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.gate.outputs.release }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve release version
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/release/resolve-version.sh

  release-build:
    name: Release Build · ${{ matrix.label }}
    needs: [ release-gate ]
    if: needs.release-gate.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, compiler: gcc, label: linux-x64 }
          - { os: ubuntu-24.04-arm, compiler: gcc, label: linux-arm64 }
          - { os: macos-15, compiler: clang, label: macos-arm64 }
          - { os: windows-2025, compiler: msvc, label: windows-x64 }
    steps:
      # The action is Linux-only, so the Windows and macOS variants go without it.
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build
        uses: ./.github/actions/compile
        with:
          os: ${{ matrix.os }}
          compiler: ${{ matrix.compiler }}
          run-tests: false
          binary-artifact: spp-${{ needs.release-gate.outputs.version }}-${{ matrix.label }}
          variant: release-rel
          build-type: Release

  # The tag is created here, by the release itself, so a matrix that goes red leaves nothing behind and a manual
  # dispatch retries the same version cleanly. Needs every platform green: a release missing an architecture is worse
  # than a release that arrives one dispatch later.
  publish-release:
    name: Publish Release
    needs: [ release-gate, release-build ]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # create the tag, the release and its assets
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443
            results-receiver.actions.githubusercontent.com:443
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
            productionresultssa2.blob.core.windows.net:443
            productionresultssa3.blob.core.windows.net:443
            productionresultssa4.blob.core.windows.net:443
            productionresultssa5.blob.core.windows.net:443
            productionresultssa6.blob.core.windows.net:443
            productionresultssa7.blob.core.windows.net:443
            productionresultssa8.blob.core.windows.net:443
            productionresultssa9.blob.core.windows.net:443

      # The changelog entry for this version is the release body.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download platform binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          pattern: spp-${{ needs.release-gate.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release-gate.outputs.version }}
        run: bash .github/scripts/release/publish.sh

  # Ordered after `build-test` so it restores that run's exact-sha tree and only has to re-run the configure step,
  # rather than racing it and falling back to the previous commit's.
  sonar:
    name: Sonar
    needs: [ changes, build-test ]
    if: |
      !cancelled()
      && needs.changes.outputs.sonar == 'true'
      && needs['build-test'].result != 'failure'
      && needs['build-test'].result != 'cancelled'
    permissions:
      contents: read
    uses: ./.github/workflows/_sonar.yaml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
