# Publishes the site, rebuilds master so its build-tree
# caches are fresh, and cuts the release for the version the
# merged PR bumped to. The cache part matters: a PR branch
# can only read caches from itself and from the base branch,
# so a warm master is what lets a brand-new PR compile
# incrementally.

name: Post-merge

on:
  push:
    branches: [ master ]
  workflow_dispatch: { }

permissions: { }

concurrency:
  group: post-merge
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Code Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ci_pins_only: ${{ steps.filter.outputs.ci_pins_only }}
      compile: ${{ steps.filter.outputs.compile }}
      sonar: ${{ steps.filter.outputs.sonar }}
      version: ${{ steps.filter.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      # Full history so the before..sha diff can be resolved.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        uses: ./.github/actions/detect-changes
        with:
          base: ${{ github.event.before }}
          head: ${{ github.sha }}

  docs:
    name: Docs
    needs: [ changes ]
    if: needs.changes.outputs.ci_pins_only != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_docs.yaml
    with:
      upload-pages-artifact: true

  publish-docs:
    name: Publish Docs
    needs: [ docs ]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write     # deploy the built site
      id-token: write  # the Pages deployment is authenticated with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  # Doubles as the master health check and as the cache warmer,
  # which is why it is the same lane the PR pipeline runs: a
  # lane missing here is a lane that compiles from cold on every
  # PR. A release runs it too, for linux-x64.
  linux:
    name: Linux gcc
    needs: [ changes, release-gate ]
    if: |
      !cancelled()
      && needs.changes.result == 'success'
      && (needs.changes.outputs.compile == 'true' || needs.release-gate.outputs.release == 'true')
    permissions:
      contents: read
    uses: ./.github/workflows/_lane.yaml

  # Only a push that bumped VERSION, or a manual dispatch, is a
  # release candidate. Without this an unpublished version is
  # retried by every later push. The tag check then stops a
  # re-run of the same push from building a second set of binaries
  # for a version that is already published.
  release-gate:
    name: Release Gate
    needs: [ changes ]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.version == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.gate.outputs.release }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve release version
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/release/resolve-version.sh

  # One lane per release platform: separate jobs, since a matrix of
  # workflow calls keeps one cell's outputs.
  release-linux-arm64:
    name: Release · linux-arm64
    needs: [ release-gate ]
    if: needs.release-gate.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_lane.yaml
    with:
      os: ubuntu-24.04-arm
      compiler: gcc
      modes: rel
      shard-count: 1

  release-macos-arm64:
    name: Release · macos-arm64
    needs: [ release-gate ]
    if: needs.release-gate.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_lane.yaml
    with:
      os: macos-15
      compiler: clang
      modes: rel
      shard-count: 1

  release-windows-x64:
    name: Release · windows-x64
    needs: [ release-gate ]
    if: needs.release-gate.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_lane.yaml
    with:
      os: windows-2025
      compiler: msvc
      modes: rel
      shard-count: 1

  # Read-only: verifies each lane's tested spp against that lane's
  # digests and names it for the release.
  collect-release:
    name: Collect Release
    needs: [ release-gate, linux, release-linux-arm64, release-macos-arm64, release-windows-x64 ]
    if: needs.release-gate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      checksums: ${{ steps.seal.outputs.checksums }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
            productionresultssa2.blob.core.windows.net:443
            productionresultssa3.blob.core.windows.net:443
            productionresultssa4.blob.core.windows.net:443
            productionresultssa5.blob.core.windows.net:443
            productionresultssa6.blob.core.windows.net:443
            productionresultssa7.blob.core.windows.net:443
            productionresultssa8.blob.core.windows.net:443
            productionresultssa9.blob.core.windows.net:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      # By name and from this run only: no run-id or github-token.
      - name: Download linux-x64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.linux.outputs.artifact }}
          path: bins/linux-x64

      - name: Download linux-arm64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.release-linux-arm64.outputs.artifact }}
          path: bins/linux-arm64

      - name: Download macos-arm64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.release-macos-arm64.outputs.artifact }}
          path: bins/macos-arm64

      - name: Download windows-x64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.release-windows-x64.outputs.artifact }}
          path: bins/windows-x64

      - name: Collect linux-x64
        env:
          VERSION: ${{ needs.release-gate.outputs.version }}
          SPP_SHA256: ${{ needs.linux.outputs.spp-sha256 }}
          TESTS_SHA256: ${{ needs.linux.outputs.tests-sha256 }}
        run: bash .github/scripts/release/collect.sh add linux-x64 ""

      - name: Collect linux-arm64
        env:
          VERSION: ${{ needs.release-gate.outputs.version }}
          SPP_SHA256: ${{ needs.release-linux-arm64.outputs.spp-sha256 }}
          TESTS_SHA256: ${{ needs.release-linux-arm64.outputs.tests-sha256 }}
        run: bash .github/scripts/release/collect.sh add linux-arm64 ""

      - name: Collect macos-arm64
        env:
          VERSION: ${{ needs.release-gate.outputs.version }}
          SPP_SHA256: ${{ needs.release-macos-arm64.outputs.spp-sha256 }}
          TESTS_SHA256: ${{ needs.release-macos-arm64.outputs.tests-sha256 }}
        run: bash .github/scripts/release/collect.sh add macos-arm64 ""

      - name: Collect windows-x64
        env:
          VERSION: ${{ needs.release-gate.outputs.version }}
          SPP_SHA256: ${{ needs.release-windows-x64.outputs.spp-sha256 }}
          TESTS_SHA256: ${{ needs.release-windows-x64.outputs.tests-sha256 }}
        run: bash .github/scripts/release/collect.sh add windows-x64 .exe

      - name: Write checksums
        id: seal
        env:
          VERSION: ${{ needs.release-gate.outputs.version }}
        run: bash .github/scripts/release/collect.sh seal

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  # Attests the digests from `needs`, with no checkout or download,
  # and before anything is published.
  attest-release:
    name: Attest Release
    needs: [ collect-release ]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write      # the Sigstore certificate is issued against this workflow's OIDC identity
      attestations: write  # store the attestation against the repository
    steps:
      # Audit until the run insights have named the Sigstore
      # and attestation endpoints.
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Write checksums file
        env:
          CHECKSUMS: ${{ needs.collect-release.outputs.checksums }}
        run: printf '%s\n' "$CHECKSUMS" > "${RUNNER_TEMP}/SHA256SUMS"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/SHA256SUMS

  # The tag is created here, by the release itself, so a lane
  # that goes red leaves nothing behind and a manual dispatch
  # retries the same version cleanly. Needs every platform
  # green and attested: a release missing an architecture or
  # its provenance is worse than a release that arrives one
  # dispatch later.
  publish-release:
    name: Publish Release
    needs: [ release-gate, collect-release, attest-release ]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # create the tag, the release and its assets
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443
            results-receiver.actions.githubusercontent.com:443
            productionresultssa0.blob.core.windows.net:443
            productionresultssa1.blob.core.windows.net:443
            productionresultssa2.blob.core.windows.net:443
            productionresultssa3.blob.core.windows.net:443
            productionresultssa4.blob.core.windows.net:443
            productionresultssa5.blob.core.windows.net:443
            productionresultssa6.blob.core.windows.net:443
            productionresultssa7.blob.core.windows.net:443
            productionresultssa8.blob.core.windows.net:443
            productionresultssa9.blob.core.windows.net:443

      # The changelog entry for this version is the release body.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Verify release files
        env:
          CHECKSUMS: ${{ needs.collect-release.outputs.checksums }}
        run: bash .github/scripts/release/verify-dist.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release-gate.outputs.version }}
        run: bash .github/scripts/release/publish.sh

  # Ordered after `linux` so it restores that run's exact-sha
  # tree and only has to re-run the configure step, rather than
  # racing it and falling back to the previous commit's.
  sonar:
    name: Sonar
    needs: [ changes, linux ]
    if: |
      !cancelled()
      && needs.changes.outputs.sonar == 'true'
      && needs.linux.result != 'failure'
      && needs.linux.result != 'cancelled'
    permissions:
      contents: read
    uses: ./.github/workflows/_sonar.yaml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
