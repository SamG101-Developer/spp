name: PR

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  merge_group: { }
  workflow_dispatch: { }

permissions: { }

concurrency:
  # One group per PR branch / dispatch ref / merge-queue ref.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the expensive jobs on changes that cannot move their result, and only those: a skipped job counts as a pass
  # for ci-success, so anything this filter gets wrong by skipping merges without ever having been compiled.
  #
  # One output per gated job rather than one shared boolean, because a CI-only change moves only the jobs that
  # actually read the file it touched - a change confined to claude.yaml gates nothing, and one to _compile.yaml runs
  # the builds without dragging cppcheck, security and sonar along with it.
  #
  # A grouped dependabot action-pin bump defeats that on its own: harden-runner and checkout are pinned in every
  # workflow, this one included, and pr.yaml is listed in every filter. So `ci_pins_only` classifies the diff by
  # content rather than path, and a diff that is only pinned `uses:` bumps gates nothing at all. Security still runs -
  # the pins are what it has to look at - but without CodeQL, whose sources did not move.
  changes:
    name: Detect Code Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ci_pins_only: ${{ steps.filter.outputs.ci_pins_only }}
      release_gate: ${{ steps.filter.outputs.release_gate }}
      cppcheck: ${{ steps.filter.outputs.cppcheck }}
      compile: ${{ steps.filter.outputs.compile }}
      cross_codegen: ${{ steps.filter.outputs.cross_codegen }}
      security: ${{ steps.filter.outputs.security }}
      sonar: ${{ steps.filter.outputs.sonar }}
    steps:
      # Secure the runner from external packages or actions.
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      # Provide the ability to git-checkout external packages and actions.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Full history so the base..head diff below can be resolved.
      - name: Detect changed paths
        id: filter
        uses: ./.github/actions/detect-changes
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}

  # Every code change ships as a release, so the VERSION file needs updating to a newer version. Non-code changes like
  # docs or CI don't need the bump.
  version:
    name: Version & Changelog
    needs: [ changes ]
    if: needs.changes.outputs.release_gate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      # Full history and tags: the check diffs VERSION against the base and refuses a number that is already tagged.
      # The "fetch-tags" key is used rather than left to fetch-depth, because a tag lookup that fails open would let a
      # version already released through.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check version bump and changelog entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/version-check/check-version.sh

  # pre-commit over the whole tree. The PR title is checked by pr_title.yaml, which needs an `edited`
  # trigger this workflow deliberately does not have.
  lint:
    name: Lint
    permissions:
      contents: read
    uses: ./.github/workflows/_lint.yaml

  # Static analysis, gating the builds so a dozen toolchains are not spent on code cppcheck already rejects. It does
  # not wait on `lint`: the only way to fix a pre-commit failure is another commit, which re-runs this workflow from
  # scratch anyway, so serialising the two only lengthens the critical path of every green PR.
  cppcheck:
    name: Static Analysis
    needs: [ changes ]
    if: needs.changes.outputs.cppcheck == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_cppcheck.yaml

  # Supported toolchain. Every variant builds in parallel and fail-fast, so one broken variant stops the others
  # immediately.
  #
  # The `if` opts out of the implicit success() over `needs` because `cppcheck` is now gated on its own filter output
  # and can legitimately be skipped while this job runs; a skipped need would otherwise skip this job too. The
  # `contains` check is what success() would have given us - cppcheck red still stops the build.
  #
  # "spp-mode" is a second axis over "build-type": it selects the optimisation pipeline the built compiler runs over
  # the s++ fixtures, so "release-rel" and "release-dev" are the same C++ binary exercising O3 and O0 codegen. The
  # sanitiser rides on "dev" rather than "rel" deliberately - it instruments the C++ compiler, whose sanitiser-visible
  # code (the analysis stages) is identical in both modes, so the only thing "rel" would add is the wall-clock of an
  # O3 pass pipeline on an already slow build.
  build-test:
    name: Build & Test
    needs: [ changes, cppcheck ]
    if: |
      !cancelled()
      && needs.changes.outputs.compile == 'true'
      && !contains(fromJSON('["failure", "cancelled"]'), needs.cppcheck.result)
    permissions:
      contents: read
    uses: ./.github/workflows/_compile.yaml
    with:
      os: ubuntu-24.04
      compiler: gcc
      version: "16"
      fail-fast: false
      variants: >-
        [
          {"name": "release-rel", "build-type": "Release", "sanitizer": "", "spp-mode": "rel", "shard-index": 0, "shard-count": 2},
          {"name": "release-rel", "build-type": "Release", "sanitizer": "", "spp-mode": "rel", "shard-index": 1, "shard-count": 2},
          {"name": "release-dev", "build-type": "Release", "sanitizer": "", "spp-mode": "dev", "shard-index": 0, "shard-count": 2},
          {"name": "release-dev", "build-type": "Release", "sanitizer": "", "spp-mode": "dev", "shard-index": 1, "shard-count": 2},
          {"name": "asan-dev", "build-type": "Debug", "sanitizer": "address+undefined+leak", "spp-mode": "dev"}
        ]

  # Aspirational toolchains: they run and report red on failure, but are deliberately omitted from ci-success, so they
  # never block a merge.
  build-test-extra:
    name: Build & Test (non-blocking)
    needs: [ changes, cppcheck ]
    if: |
      !cancelled()
      && needs.changes.outputs.compile == 'true'
      && !contains(fromJSON('["failure", "cancelled"]'), needs.cppcheck.result)
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, compiler: gcc, version: "16", cache-tree: true }
          - { os: ubuntu-24.04-arm, compiler: clang, version: "23", cache-tree: true }
          - { os: ubuntu-24.04, compiler: clang, version: "23", cache-tree: true }
          # - { os: macos-26, compiler: clang, version: "23", cache-tree: true }
          - { os: macos-15, compiler: clang, version: "23", cache-tree: true }
          - { os: windows-2025, compiler: msvc, version: "", cache-tree: true }
          - { os: windows-2025, compiler: clang-cl, version: "", cache-tree: true }
          # - { os: windows-2022, compiler: msvc, version: "", cache-tree: false }
    uses: ./.github/workflows/_compile.yaml
    with:
      os: ${{ matrix.os }}
      compiler: ${{ matrix.compiler }}
      version: ${{ matrix.version }}
      fail-fast: false
      cache-build-tree: ${{ matrix.cache-tree }}
      variants: '[{"name": "release", "build-type": "RelWithDebInfo", "sanitizer": ""}]'

  # Emit for architectures unlike the host - 32-bit, big-endian, non-x86 - and check the object and the datalayout
  # that came out. Non-blocking to begin with. Todo: Add to ci-success once the matrix has been green for a while.
  cross-codegen:
    name: Cross Codegen (non-blocking)
    needs: [ changes, cppcheck ]
    if: |
      !cancelled()
      && needs.changes.outputs.cross_codegen == 'true'
      && !contains(fromJSON('["failure", "cancelled"]'), needs.cppcheck.result)
    permissions:
      contents: read
    uses: ./.github/workflows/_cross_codegen.yaml

  # Independent of the compilation chain: doc breakage is worth hearing about even while the build is still running.
  docs:
    name: Docs
    permissions:
      contents: read
    uses: ./.github/workflows/_docs.yaml

  security:
    name: Security
    needs: [ changes ]
    if: needs.changes.outputs.security == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/_security.yaml
    with:
      code-scan: ${{ needs.changes.outputs.ci_pins_only != 'true' }}

  # Advisory: runs SonarQube Cloud analysis with PR decoration, but is deliberately omitted from ci-success, so a red
  # quality gate does not block a merge. Todo: Add it to the ci-success `needs` list to make it blocking.
  sonar:
    name: Sonar
    needs: [ changes ]
    if: |
      needs.changes.outputs.sonar == 'true'
      && (github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    uses: ./.github/workflows/_sonar.yaml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Advisory, like Sonar, and omitted from ci-success for the same reason. There is nothing to review in a pin bump,
  # so it sits behind `changes` to skip those rather than spend a review on a pair of SHAs.
  claude-review:
    name: Claude Review
    needs: [ changes ]
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.changes.outputs.ci_pins_only != 'true'
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: ./.github/workflows/_claude_review.yaml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # One of the two required status checks for branch protection, the other being "PR Title Format" from
  # pr_title.yaml. Fails if any needed job failed or was cancelled; passes when they all succeeded or were skipped.
  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs: [ lint, version, cppcheck, build-test, docs, security ] # sonar
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { }
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Verify all required jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "One or more required jobs did not succeed:"
          echo "$NEEDS_JSON"
          exit 1
