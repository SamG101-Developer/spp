name: PR

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  merge_group: { }
  workflow_dispatch: { }

permissions: { }

concurrency:
  # One group per PR branch / dispatch ref / merge-queue ref.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the expensive jobs on changes that cannot move their
  # result, and only those: a skipped job counts as a pass for
  # ci-success, so anything this filter gets wrong by skipping
  # merges without ever having been compiled. One output per
  # gated job, because a CI-only change moves only the jobs
  # that read the file it touched.
  changes:
    name: Detect Code Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ci_pins_only: ${{ steps.filter.outputs.ci_pins_only }}
      release_gate: ${{ steps.filter.outputs.release_gate }}
      cppcheck: ${{ steps.filter.outputs.cppcheck }}
      compile: ${{ steps.filter.outputs.compile }}
      cross_codegen: ${{ steps.filter.outputs.cross_codegen }}
      security: ${{ steps.filter.outputs.security }}
      sonar: ${{ steps.filter.outputs.sonar }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      # Full history so the base..head diff can be resolved. This
      # allows for the detect-changes action to mark which groups
      # of files have changed.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        uses: ./.github/actions/detect-changes
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}

  # Every code change ships as a release, so it has to bump
  # VERSION and bring its changelog entry. Docs and CI-only
  # changes do not.
  version:
    name: Version & Changelog
    needs: [ changes ]
    if: needs.changes.outputs.release_gate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      # Tags as well as history: the check refuses a version
      # that is already released, and a tag lookup that failed
      # open would let one through.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Run the check-version script, which is a shell script
      # to check that there is a version bump and a changelog
      # present for the new version.
      - name: Check version bump and changelog entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/release/check-version.sh

  # Pre-commit over the whole tree. The PR title is checked
  # by pr_title.yaml, which needs an `edited` trigger this
  # workflow deliberately does not have.
  lint:
    name: Lint
    permissions:
      contents: read
    uses: ./.github/workflows/_lint.yaml

  # Gates the builds so a dozen toolchains are not spent on
  # code cppcheck already rejects. It does not wait on `lint`:
  # fixing a pre-commit failure needs another commit, which
  # re-runs this workflow from scratch anyway.
  cppcheck:
    name: Static Analysis
    needs: [ changes ]
    if: needs.changes.outputs.cppcheck == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_cppcheck.yaml

  # Every build needs cppcheck, so they all sit in one column of
  # the job graph and every test in the next. The `if` opts out
  # of the implicit success() over `needs`, because cppcheck has
  # its own filter and can be skipped while this runs; a skipped
  # need would otherwise skip the build too. Red cppcheck still
  # stops it. The anchors here are reused by every build.
  linux-gcc-build:
    name: Linux GCC
    needs: &build-needs [ changes, cppcheck ]
    if: &build-gate |
      !cancelled()
      && needs.cppcheck.result != 'failure'
      && needs.cppcheck.result != 'cancelled'
      && needs.changes.outputs.compile == 'true'
    permissions: &read
      contents: read
    uses: ./.github/workflows/_build.yaml
    with:
      modes: rel dev
      shard-count: 2
      pack: false
      valgrind: true
      codegen: true
      differential: true

  linux-clang-build:
    name: Linux Clang
    needs: *build-needs
    if: *build-gate
    permissions: *read
    uses: ./.github/workflows/_build.yaml
    with:
      compiler: clang

  linux-arm-gcc-build:
    name: Linux ARM GCC
    needs: *build-needs
    if: *build-gate
    permissions: *read
    uses: ./.github/workflows/_build.yaml
    with:
      os: ubuntu-24.04-arm

  linux-arm-clang-build:
    name: Linux ARM Clang
    needs: *build-needs
    if: *build-gate
    permissions: *read
    uses: ./.github/workflows/_build.yaml
    with:
      os: ubuntu-24.04-arm
      compiler: clang

  # Not in ci-success until its spp_tests abort is fixed.
  macos-clang-build:
    name: macOS Clang
    needs: *build-needs
    if: *build-gate
    permissions: *read
    uses: ./.github/workflows/_build.yaml
    with:
      os: macos-15
      compiler: clang

  # Not in ci-success until sppc builds for Windows.
  windows-msvc-build:
    name: Windows MSVC
    needs: *build-needs
    if: *build-gate
    permissions: *read
    uses: ./.github/workflows/_build.yaml
    with:
      os: windows-2025
      compiler: msvc

  # Todo: drop advisory once CMake 4.5 (import std for clang-cl) is pinned; see .triages/upstream-watch.md U14.
  windows-clang-cl-build:
    name: Windows clang-cl (Advisory)
    needs: *build-needs
    if: *build-gate
    permissions: *read
    uses: ./.github/workflows/_build.yaml
    with:
      os: windows-2025
      compiler: clang-cl
      advisory: true

  # Every backend linked in, for the emits below. Todo: Add to
  # ci-success once more stable.
  cross-codegen-build:
    name: Cross Codegen (Advisory)
    needs: *build-needs
    if: |
      !cancelled()
      && needs.cppcheck.result != 'failure'
      && needs.cppcheck.result != 'cancelled'
      && needs.changes.outputs.cross_codegen == 'true'
    permissions: *read
    uses: ./.github/workflows/_build.yaml
    with:
      variant: all-targets
      cmake-flags: "-DSPP_ALL_TARGETS=ON -DSPP_BUILD_TESTS=OFF"

  # Each lane's tests, against its own build only. A failed build
  # skips its tests; ci-success fails a skipped gating test when
  # the compile gate is on.
  linux-gcc-test:
    name: Linux GCC
    needs: [ linux-gcc-build ]
    permissions: *read
    uses: ./.github/workflows/_test.yaml
    with:
      build: ${{ toJSON(needs.linux-gcc-build.outputs) }}

  linux-clang-test:
    name: Linux Clang
    needs: [ linux-clang-build ]
    permissions: *read
    uses: ./.github/workflows/_test.yaml
    with:
      build: ${{ toJSON(needs.linux-clang-build.outputs) }}

  linux-arm-gcc-test:
    name: Linux ARM GCC
    needs: [ linux-arm-gcc-build ]
    permissions: *read
    uses: ./.github/workflows/_test.yaml
    with:
      build: ${{ toJSON(needs.linux-arm-gcc-build.outputs) }}

  linux-arm-clang-test:
    name: Linux ARM Clang
    needs: [ linux-arm-clang-build ]
    permissions: *read
    uses: ./.github/workflows/_test.yaml
    with:
      build: ${{ toJSON(needs.linux-arm-clang-build.outputs) }}

  macos-clang-test:
    name: macOS Clang
    needs: [ macos-clang-build ]
    permissions: *read
    uses: ./.github/workflows/_test.yaml
    with:
      build: ${{ toJSON(needs.macos-clang-build.outputs) }}

  # Todo: drop "off" once LLVM's split stack checks MSVC's canary; see .triages/upstream-watch.md U15.
  windows-msvc-test:
    name: Windows MSVC
    needs: [ windows-msvc-build ]
    permissions: *read
    uses: ./.github/workflows/_test.yaml
    with:
      build: ${{ toJSON(needs.windows-msvc-build.outputs) }}
      off: &msvc-off memory.stack.split

  windows-clang-cl-test:
    name: Windows clang-cl (Advisory)
    needs: [ windows-clang-cl-build ]
    permissions: *read
    uses: ./.github/workflows/_test.yaml
    with:
      build: ${{ toJSON(needs.windows-clang-cl-build.outputs) }}
      off: *msvc-off

  cross-codegen-test:
    name: Cross Codegen (Advisory)
    needs: [ cross-codegen-build ]
    permissions: *read
    uses: ./.github/workflows/_cross_codegen.yaml
    with:
      build: ${{ toJSON(needs.cross-codegen-build.outputs) }}

  # Independent of the compilation chain: doc breakage is worth
  # hearing about while the build is still running.
  docs:
    name: Docs
    permissions: *read
    uses: ./.github/workflows/_docs.yaml

  # Ungated by cppcheck: these read the tree and the dependency
  # graph rather than building it, so there is nothing to save
  # by making them wait, and a leaked secret is worth hearing
  # about at once.
  security:
    name: Security
    needs: [ changes ]
    if: needs.changes.outputs.security == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/_security.yaml

  # CodeQL and Sonar each build the whole project. Not behind
  # cppcheck, so the build column holds only builds; on a red
  # cppcheck they still run. Sonar is advisory inside the call,
  # so only CodeQL can fail it.
  analysis:
    name: Analysis
    needs: [ changes ]
    if: |
      (needs.changes.outputs.security == 'true' && needs.changes.outputs.ci_pins_only != 'true')
      || needs.changes.outputs.sonar == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/_analysis.yaml
    with:
      codeql: ${{ needs.changes.outputs.security == 'true' && needs.changes.outputs.ci_pins_only != 'true' }}
      sonar: >-
        ${{ needs.changes.outputs.sonar == 'true'
        && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Advisory. There is nothing to review in a pin bump, so it
  # sits behind `changes` to skip those rather than spend a
  # review on a pair of SHAs.
  # Todo: Require all conversations to be resolved before merging.
  claude-review:
    name: Claude Review (Advisory)
    needs: [ changes ]
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.changes.outputs.ci_pins_only != 'true'
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: ./.github/workflows/_claude_review.yaml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # One of the two required status checks for branch protection,
  # the other being "PR Title Format" from pr_title.yaml. Fails
  # if any needed job failed or was cancelled, or if a gating
  # lane's tests did not pass while the compile gate was on: a
  # failed build skips its tests, and a skip otherwise passes.
  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs:
      - changes
      - lint
      - version
      - cppcheck
      - docs
      - security
      - linux-gcc-test
      - linux-clang-test
      - linux-arm-gcc-test
      - linux-arm-clang-test
      - analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { }
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      # Inline: a script would need a checkout, and this job
      # holds no `contents: read`.
      - name: Verify all required jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "One or more required jobs did not succeed:"
          echo "$NEEDS_JSON"
          exit 1

      - name: Verify the gating lanes ran
        if: >-
          ${{ needs.changes.outputs.compile == 'true'
          && (needs.linux-gcc-test.result != 'success'
            || needs.linux-clang-test.result != 'success'
            || needs.linux-arm-gcc-test.result != 'success'
            || needs.linux-arm-clang-test.result != 'success') }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "The compile gate is on, but a gating lane's tests did not pass (a failed build skips them):"
          echo "$NEEDS_JSON"
          exit 1
