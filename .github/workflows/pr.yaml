name: PR

on:
  pull_request:
    types: [ opened, synchronize, reopened, edited ]
  merge_group: { }
  workflow_dispatch: { }

concurrency:
  # One group per PR branch / dispatch ref / merge-queue ref.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the expensive jobs on docs-only / config-only changes. A skipped job counts as a pass for ci-success, so
  # branch protection stays satisfied either way.
  changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # Lock down the workflow with the harden-runner action, as external packages or actions are fetched and executed.
      # This ensures better security in CI/CD pipeline.
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      # Provide capability to git-checkout external packages and actions. Anything done via this will be automatically
      # secured under the above "harden-runner" step. Nothing is built here, so the mtime pass is not needed.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Full history so the base..head diff below can be resolved.
      - name: Detect changed paths
        id: filter
        uses: ./.github/actions/detect-changes
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}

  # PR title check and pre-commit, side by side.
  lint:
    name: Lint
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_lint.yaml

  # Supported toolchain. "Release" and both "sanitiser" configurations build in parallel and fail-fast, so one broken
  # variant stops the others immediately.
  build-test:
    name: Build & Test
    needs: [ changes ]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_compile.yaml
    with:
      os: ubuntu-latest
      compiler: gcc
      version: "16"
      fail-fast: true
      variants: >-
        [
          {"name": "release", "build-type": "Release", "sanitizer": ""},
          {"name": "asan", "build-type": "Debug", "sanitizer": "address+undefined+leak"}
        ]

  # Aspirational toolchains: they run and report red on failure, but are deliberately omitted from ci-success, so they
  # never block a merge.
  build-test-extra:
    name: Build & Test (non-blocking)
    needs: [ changes ]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, compiler: clang, version: "22" }
          - { os: macos-latest, compiler: clang, version: "" }
          - { os: windows-latest, compiler: msvc, version: "" }
          - { os: windows-latest, compiler: clang-cl, version: "" }
    uses: ./.github/workflows/_compile.yaml
    with:
      os: ${{ matrix.os }}
      compiler: ${{ matrix.compiler }}
      version: ${{ matrix.version }}
      fail-fast: false
      variants: '[{"name": "release", "build-type": "RelWithDebInfo", "sanitizer": ""}]'

  # Independent of the compile chain: doc breakage is worth hearing about even while the build is still running.
  docs:
    name: Docs
    permissions:
      contents: read
    uses: ./.github/workflows/_docs.yaml

  security:
    name: Security
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/_security.yaml

  # Advisory: runs SonarQube Cloud analysis with PR decoration, but is deliberately omitted from ci-success, so a red
  # quality gate does not block a merge. Todo: Add it to the ci-success `needs` list to make it blocking.
  sonar:
    name: Sonar
    needs: [ changes ]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_sonar.yaml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The single required status check for branch protection. Fails if any needed job failed or was cancelled; passes when
  # they all succeeded or were skipped.
  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs: [ changes, lint, build-test, docs, security ] # sonar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { }
    steps:
      - name: Verify all required jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "One or more required jobs did not succeed:"
          echo "$NEEDS_JSON"
          exit 1
