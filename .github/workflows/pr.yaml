name: PR

on:
  pull_request:
    types: [ opened, synchronize, reopened, edited ]
  merge_group: { }
  workflow_dispatch: { }

permissions: { }

concurrency:
  # One group per PR branch / dispatch ref / merge-queue ref.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the expensive jobs on documentation-only changes, and only those: a skipped job counts as a pass for
  # ci-success, so anything this filter gets wrong by skipping merges without ever having been compiled.
  changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # Secure the runner from external packages or actions.
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      # Provide the ability to git-checkout external packages and actions.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Full history so the base..head diff below can be resolved.
      - name: Detect changed paths
        id: filter
        uses: ./.github/actions/detect-changes
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}

  # PR title check and pre-commit, side by side.
  lint:
    name: Lint
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_lint.yaml

  # Supported toolchain. "Release" and both "sanitiser" configurations build in parallel and fail-fast, so one broken
  # variant stops the others immediately.
  build-test:
    name: Build & Test
    needs: [ changes ]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_compile.yaml
    with:
      os: ubuntu-24.04
      compiler: gcc
      version: "16"
      fail-fast: true
      variants: >-
        [
          {"name": "release", "build-type": "Release", "sanitizer": ""},
          {"name": "asan", "build-type": "Debug", "sanitizer": "address+undefined+leak"}
        ]

  # Aspirational toolchains: they run and report red on failure, but are deliberately omitted from ci-success, so they
  # never block a merge.
  build-test-extra:
    name: Build & Test (non-blocking)
    needs: [ changes ]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, compiler: gcc, version: "16" }
          - { os: ubuntu-24.04, compiler: clang, version: "22" }
          - { os: macos-latest, compiler: clang, version: "" }
          - { os: windows-latest, compiler: msvc, version: "" }
          - { os: windows-latest, compiler: clang-cl, version: "" }
    uses: ./.github/workflows/_compile.yaml
    with:
      os: ${{ matrix.os }}
      compiler: ${{ matrix.compiler }}
      version: ${{ matrix.version }}
      fail-fast: false
      variants: '[{"name": "release", "build-type": "RelWithDebInfo", "sanitizer": ""}]'

  # Independent of the compilation chain: doc breakage is worth hearing about even while the build is still running.
  docs:
    name: Docs
    permissions:
      contents: read
    uses: ./.github/workflows/_docs.yaml

  security:
    name: Security
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/_security.yaml

  # Advisory: runs SonarQube Cloud analysis with PR decoration, but is deliberately omitted from ci-success, so a red
  # quality gate does not block a merge. Todo: Add it to the ci-success `needs` list to make it blocking.
  sonar:
    name: Sonar
    needs: [ changes ]
    if: |
      needs.changes.outputs.code == 'true'
      && (github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    uses: ./.github/workflows/_sonar.yaml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Advisory, like Sonar, and omitted from ci-success for the same reason.
  claude-review:
    name: Claude Review
    if: |
      github.event_name == 'pull_request'
      && github.event.action != 'edited'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    uses: ./.github/workflows/_claude_review.yaml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # The single required status check for branch protection. Fails if any needed job failed or was cancelled; passes when
  # they all succeeded or were skipped.
  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs: [ changes, lint, build-test, docs, security ] # sonar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { }
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Verify all required jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "One or more required jobs did not succeed:"
          echo "$NEEDS_JSON"
          exit 1
