name: Nightly

# The long jobs that would conflict with pushing code: the full-history scans, the Scorecard grade, and pruning the
# caches and runs that have gone stale. Link rot is checked by the lychee pre-commit hook, not here.

on:
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List the runs that would be deleted, without deleting them"
        type: boolean
        default: true

permissions: { }

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # A failsafe over master: covers branches that were scanned individually and are only now in combination.
  security:
    name: Security (Full Scan)
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/_security.yaml
    with:
      full-scan: true

  # Unconditional here, unlike on a pull request: master has already been through the cppcheck gate, and there is no
  # diff filter to read on a scheduled run.
  codeql:
    name: CodeQL (Full Scan)
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/_codeql.yaml
    with:
      full-scan: true

  # Grades what cannot be seen from inside a workflow: token permissions, action pinning, branch protection.
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # upload the Scorecard SARIF
      id-token: write         # only used when publish_results is turned on
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      # publish_results is off: turning it on posts the score to the public OpenSSF API, which is what backs the
      # README badge. Todo: Flip this when badge is ready.
      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard results
        if: always() && hashFiles('scorecard.sarif') != ''
        uses: github/codeql-action/upload-sarif@e58424170fb0262c8d7ed60a2e84b9bffe205c67
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  # Superseded entries are never restored again but still count against the repository's 10 GB budget until they
  # are evicted, and that budget is what decides whether master's warm build trees survive the night.
  prune-caches:
    name: Prune Stale Caches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write  # delete the repository's Actions caches
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Delete superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/nightly/prune-caches.sh

  prune-runs:
    name: Prune Old Workflow Runs
    runs-on: ubuntu-24.04
    # Roughly one second per run deleted: Octokit's throttling plugin serialises the writes. A steady night is a
    # minute, and whatever a backlog does not reach is picked up by the next night.
    timeout-minutes: 60
    permissions:
      actions: write  # list and delete the repository's workflow runs
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Delete runs outside the retention window
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee  # v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 1
          dry_run: ${{ inputs.dry_run || false }}
