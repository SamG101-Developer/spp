name: Nightly

# The Nightly script runs as 4am every day, to perform long actions that will conflict with pushing code. They key jobs
# are pruning stale caches (force external package rebuild every day for updates). Cache keys also use a manual version
# so can be bumped within the day.

on:
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List the runs that would be deleted, without deleting them"
        type: boolean
        default: true

permissions: { }

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Re-run the security steps just as a failsafe; anything else should have been picked up, but this also covers
  # multiple individually scanned branches now in combination on master.
  security:
    name: Security (Full Scan)
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/_security.yaml
    with:
      full-scan: true

  # Grades the things that cannot be seen from inside a workflow: token permissions, whether actions are pinned, and
  # branch protection.
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # upload the Scorecard SARIF
      id-token: write         # only used when publish_results is turned on
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      # publish_results is off: turning it on posts the score to the public OpenSSF API, which is what backs the
      # README badge. Todo: Flip this when badge is ready.
      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard results
        if: always() && hashFiles('scorecard.sarif') != ''
        uses: github/codeql-action/upload-sarif@e58424170fb0262c8d7ed60a2e84b9bffe205c67
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  # Link rot is checked by the lychee pre-commit hook, not here.

  # Superseded entries are never read again but still count against the repository's 10GB budget until they are
  # evicted: every compiler cache behind the newest one on its branch, every dependency tree whose key hash has moved
  # on, and every Doxygen build older than the pinned release. Prune them once they are stale.
  prune-caches:
    name: Prune Stale Caches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write  # delete the repository's Actions caches
    steps:
      # Secure the runner from external packages or actions.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      # Provide the ability to git-checkout external packages and actions.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Run the prune-cache script.
      - name: Delete superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/nightly/prune-caches.sh

  prune-runs:
    name: Prune Old Workflow Runs
    runs-on: ubuntu-24.04
    # Octokit's throttling plugin serialises writes onto one connection at a minimum of a second apart, so the job's
    # wall-clock is roughly one second per run deleted. A steady night is a minute; the first run has a backlog of
    # hundreds and needs the headroom, and anything it does not reach is simply picked up by the next night.
    timeout-minutes: 60
    permissions:
      actions: write  # list and delete the repository's workflow runs
    steps:
      # Secure the runner from external packages or actions.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Delete runs outside the retention window
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee  # v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 1
          dry_run: ${{ inputs.dry_run || false }}
