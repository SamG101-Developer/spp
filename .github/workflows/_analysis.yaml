# The two analyses that build the whole project: CodeQL under its
# extractor, and Sonar over the release tree. Each runs only when
# asked for. Sonar is advisory: a red quality gate does not fail
# the call.

name: analysis

on:
  workflow_call:
    inputs:
      codeql:
        description: "Run CodeQL."
        required: false
        type: boolean
        default: false
      full-scan:
        description: "CodeQL runs security-and-quality rather than security-extended."
        required: false
        type: boolean
        default: false
      sonar:
        description: "Run the Sonar scan."
        required: false
        type: boolean
        default: false
      sonar-os:
        description: "Must match the os the variant below was built on, or the build-tree cache never hits."
        required: false
        type: string
        default: "ubuntu-24.04"
      sonar-variant:
        description: "Build variant whose tree Sonar restores. Must be one _build.yaml actually builds on that os."
        required: false
        type: string
        default: "release"
      coverage-artifact:
        description: "A coverage report artifact from this run, for the Sonar scan to read; none when empty."
        required: false
        type: string
        default: ""
    secrets:
      SONAR_TOKEN:
        required: false

permissions: { }

jobs:
  codeql:
    name: CodeQL
    if: inputs.codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read          # checkout
      security-events: write  # upload CodeQL results
      actions: read           # read workflow run metadata (private repos)
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python and load pins
        uses: ./.github/actions/setup-python

      # Tracks the manifest's GCC rather than naming a compiler
      # of its own. No compiler cache: a hit skips the real
      # compiler, and the extractor never sees the translation
      # unit.
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          runner-image: ubuntu-24.04
          compiler: gcc
          version: ${{ env.GCC_VERSION }}
          compiler-cache: "false"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: c-cpp
          build-mode: manual
          config-file: ./.github/codeql-config.yaml
          queries: ${{ inputs.full-scan && 'security-and-quality' || 'security-extended' }}

      - name: Configure
        uses: ./.github/actions/configure-cmake
        with:
          build-type: Debug

      - name: Build
        run: cmake --build build --parallel

      # Uploads the results too.
      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:c-cpp"

  # Restores the release variant's build tree; Sonar only adds
  # -DCMAKE_EXPORT_COMPILE_COMMANDS, which invalidates no objects,
  # so the build below is just the configure step catching up.
  sonar:
    name: Sonar (Advisory)
    if: inputs.sonar
    runs-on: ${{ inputs.sonar-os }}
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python and load pins
        uses: ./.github/actions/setup-python

      - name: Restore source mtimes
        uses: ./.github/actions/restore-mtimes

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          runner-image: ${{ inputs.sonar-os }}
          compiler: gcc
          version: ${{ env.GCC_VERSION }}
          cache-key-suffix: sonar

      # The key comes from the same action the compile action
      # writes the tree with, so restoring it needs only the
      # variant name to agree.
      - name: Compose build tree cache key
        id: cache-key
        uses: ./.github/actions/build-cache-key
        with:
          os: ${{ inputs.sonar-os }}
          compiler: gcc
          version: ${{ env.GCC_VERSION }}
          variant: ${{ inputs.sonar-variant }}

      - name: Restore build tree
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}

      - name: Configure
        uses: ./.github/actions/configure-cmake
        with:
          build-type: Release
          extra-flags: -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # Needed for the compile_commands.json the scanner reads, not
      # for the objects.
      - name: Build
        run: cmake --build build --parallel

      - name: Download coverage report
        if: inputs.coverage-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.coverage-artifact }}
          path: coverage

      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: ${{ inputs.coverage-artifact != '' && '-Dsonar.cfamily.llvm-cov.reportPath=coverage/coverage.txt' || '' }}
