name: docs

on:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: "Upload the built site as a GitHub Pages artifact, ready for a deploy job to consume."
        required: false
        type: boolean
        default: false

jobs:
  docs:
    # Build the documentation using the custom python script that already exists in the "docs" folder. The python env
    # setup is required here with package management, followed by all the Doxygen config and building.

    name: Build Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Lock down the workflow with the harden-runner action, as external packages or actions are fetched and executed.
      # This ensures better security in CI/CD pipeline.
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      # Provide capability to git-checkout external packages and actions. Anything done via this will be automatically
      # secured under the above "harden-runner" step. Nothing is compiled here, so a shallow clone is enough.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Cache-key versions and toolchain pins all live in .github/versions.env.
      - name: Load pinned versions
        run: bash .github/scripts/lib/load-versions.sh

      # Download and set up the "uv" library. This manages the entire python env, setup and package management systems.
      # The lockfile is attached from the root of this repository.
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Set up the cache steps for the doxygen installation, keyed on the pinned release.
      - name: Cache Doxygen
        id: doxygen-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          # SPP_DOXYGEN_PREFIX; spelled literally because actions/cache resolves `~` on every runner.
          path: ~/.tools/doxygen
          key: doxygen-${{ runner.os }}-${{ env.DOXYGEN_VERSION }}-v${{ env.DOXYGEN_CACHE_VERSION }}

      - name: Install Doxygen (cache miss)
        if: steps.doxygen-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/docs/install-doxygen.sh

      - name: Expose Doxygen
        run: echo "$SPP_DOXYGEN_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Check versions
        run: |
          doxygen --version
          uv run sphinx-build --version

      - name: Build documentation
        run: uv run python docs/generate2.py

      # Unlike the test logs, an empty site is not a valid outcome: it means the build produced
      # nothing, so fail rather than upload an empty artefact.
      - name: Upload HTML artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-html
          path: docs/build/html
          retention-days: 7
          if-no-files-found: error

      - name: Upload Pages artefact
        if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: docs/build/html
