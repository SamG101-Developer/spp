# Generate / check Doxygen documentation. Find missing docs
# for PRs. In the future, will fail CI if any are missing (or
# incorrectly formatted).
name: docs

on:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: "Upload the built site as a GitHub Pages artifact, ready for a deploy job to consume."
        required: false
        type: boolean
        default: false

permissions: { }

jobs:
  docs:
    name: Doxygen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python and load pins
        uses: ./.github/actions/setup-python

      # uv manages the documentation build's own Python environment,
      # from the lockfile at the repository root.
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Cache a Doxygen installation so that it doesn't need to be
      # re-downloaded on every run.
      - name: Cache Doxygen
        id: doxygen-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.tools/doxygen
          key: doxygen-${{ runner.os }}-${{ hashFiles('.github/dependencies.toml', '.github/scripts/lib/pins.py', '.github/scripts/setup/install-doxygen.sh') }}

      # Two independent downloads, so they overlap rather than queue.
      # `Expose Doxygen` stays outside the group: a background step's
      # GITHUB_PATH write only lands at the implicit wait that closes
      # it.
      - parallel:
          - name: Install Doxygen (cache miss)
            if: steps.doxygen-cache.outputs.cache-hit != 'true'
            run: bash .github/scripts/setup/install-doxygen.sh

          - name: Install Python dependencies
            run: uv sync --locked

      # Push the Doxygen prefix to the GITHUB_PATH, so that the Doxygen
      # binary is available to the rest of the workflow.
      - name: Expose Doxygen
        run: echo "$SPP_DOXYGEN_PREFIX/bin" >> "$GITHUB_PATH"

      # Check the versions of the tools we use.
      - name: Check versions
        run: |
          doxygen --version
          uv run sphinx-build --version

      # Build the documentation.
      - name: Build documentation
        run: uv run python docs/generate2.py

      # An empty site is not a valid outcome: it means the build
      # produced nothing.
      - name: Upload HTML artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-html
          path: docs/build/html
          retention-days: 7
          if-no-files-found: error

      - name: Upload Pages artefact
        if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: docs/build/html
