# Whatever a coverage build's test cells covered, failed cells
# included: a red test still ran the code it reached.

name: coverage

on:
  workflow_call:
    inputs:
      build:
        description: "The coverage build job's outputs, as JSON: `toJSON(needs.<build job>.outputs)`."
        required: true
        type: string

    outputs:
      artifact:
        description: "Name of the coverage report artifact."
        value: ${{ jobs.coverage.outputs.artifact }}

permissions: { }

jobs:
  coverage:
    name: Coverage
    runs-on: ${{ fromJSON(inputs.build).os }}
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      # Sudo installs llvm-profdata and llvm-cov.
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # The sources llvm-cov shows, at the commit the binaries were built from.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch and verify binaries
        uses: ./.github/actions/setup-runtime
        with:
          artifact: ${{ fromJSON(inputs.build).artifact }}
          spp-sha256: ${{ fromJSON(inputs.build)['spp-sha256'] }}
          tests-sha256: ${{ fromJSON(inputs.build)['tests-sha256'] }}

      - name: Download coverage profiles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: prof-${{ fromJSON(inputs.build).os }}-${{ fromJSON(inputs.build).variant }}-*
          path: ${{ runner.temp }}/prof
          merge-multiple: true

      - name: Install llvm-profdata and llvm-cov
        run: |
          bash .github/scripts/setup/fetch-llvm-sh.sh
          sudo "$RUNNER_TEMP/llvm.sh" "$LLVM_LIB_VERSION"

      - name: Merge and report
        run: bash .github/scripts/test/coverage-report.sh

      - name: Name the report
        id: name
        env:
          OS: ${{ fromJSON(inputs.build).os }}
          VARIANT: ${{ fromJSON(inputs.build).variant }}
        run: echo "artifact=coverage-${OS}-${VARIANT}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: |
            coverage/coverage.txt
            coverage/coverage.lcov
            coverage/report.txt
          if-no-files-found: error
          retention-days: 7
