# The coverage lane: a clang build that records what it runs, the
# suites over it, and the merged report, which Sonar reads. The
# report covers failed cells too: a red test still ran the code it
# reached.

name: coverage

on:
  workflow_call:
    outputs:
      artifact:
        description: "Name of the coverage report artifact; empty when the lane did not report."
        value: ${{ jobs.report.outputs.artifact }}

permissions: { }

jobs:
  build:
    name: Build
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yaml
    with:
      compiler: clang
      variant: coverage
      coverage: true
      shard-count: 2
      pack: false
      codegen: true
      differential: true

  test:
    name: Test
    needs: [ build ]
    permissions:
      contents: read
    uses: ./.github/workflows/_test.yaml
    with:
      build: ${{ toJSON(needs.build.outputs) }}

  # Waits on every cell, as it merges all their profiles.
  report:
    name: Report
    needs: [ build, test ]
    if: ${{ !cancelled() && needs.build.outputs.artifact != '' }}
    runs-on: ${{ needs.build.outputs.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id != '' && 'coverage-report' || '' }}
    steps:
      # Sudo installs llvm-profdata and llvm-cov.
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The sources llvm-cov shows, at the commit the binaries were built from.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch and verify binaries
        uses: ./.github/actions/setup-runtime
        with:
          artifact: ${{ needs.build.outputs.artifact }}
          spp-sha256: ${{ needs.build.outputs.spp-sha256 }}
          tests-sha256: ${{ needs.build.outputs.tests-sha256 }}

      - name: Download coverage profiles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: prof-${{ needs.build.outputs.os }}-${{ needs.build.outputs.variant }}-*
          path: ${{ runner.temp }}/prof
          merge-multiple: true

      - name: Install llvm-profdata and llvm-cov
        run: |
          bash .github/scripts/setup/fetch-llvm-sh.sh
          sudo "$RUNNER_TEMP/llvm.sh" "$LLVM_LIB_VERSION"

      - name: Merge and report
        run: bash .github/scripts/test/coverage-report.sh

      - name: Upload coverage report
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage/coverage.txt
            coverage/coverage.lcov
            coverage/report.txt
          if-no-files-found: error
          retention-days: 7
