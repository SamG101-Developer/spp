# The coverage lane, drawn as one box in the job graph: a clang
# build that records what it runs, the suites over it, and the
# merged report, which Sonar reads. The report covers failed
# cells too: a red test still ran the code it reached.

name: coverage

on:
  workflow_call:
    outputs:
      artifact:
        description: "Name of the coverage report artifact; empty when the lane did not report."
        value: ${{ jobs.report.outputs.artifact }}

permissions: { }

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      tests: ${{ steps.build.outputs.tests }}
      artifact: ${{ steps.build.outputs.artifact }}
      spp-sha256: ${{ steps.build.outputs.spp-sha256 }}
      tests-sha256: ${{ steps.build.outputs.tests-sha256 }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # Full history: restore-mtimes walks it to date the sources for
      # the incremental build.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and plan the tests
        id: build
        uses: ./.github/actions/build-and-plan
        with:
          compiler: clang
          variant: coverage
          coverage: true
          shard-count: 2
          pack: false
          codegen: true
          differential: true

  # As _lane.yaml's test job, less valgrind, plus a profile per
  # cell. Advisory cells as there.
  test:
    name: ${{ matrix.label }}
    needs: [ build ]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.advisory }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.tests) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch and verify binaries
        uses: ./.github/actions/setup-runtime
        with:
          artifact: ${{ needs.build.outputs.artifact }}
          spp-sha256: ${{ needs.build.outputs.spp-sha256 }}
          tests-sha256: ${{ needs.build.outputs.tests-sha256 }}

      # A merge pool: each binary's processes share 8 files rather than writing one each.
      - name: Collect coverage profiles
        run: |
          mkdir -p "$RUNNER_TEMP/prof"
          echo "LLVM_PROFILE_FILE=$RUNNER_TEMP/prof/%8m.profraw" >> "$GITHUB_ENV"

      - parallel:
          - name: Run tests
            id: tests
            if: contains(matrix.suites, 'gtest')
            uses: ./.github/actions/run-tests
            env:
              SPP_TEST_MODE: ${{ matrix.mode }}
            with:
              shard-count: ${{ matrix.shards }}
              shard-index: ${{ matrix.shard }}

          - name: s++ STL conformance
            if: contains(matrix.suites, 'stl')
            run: bash .github/scripts/test/stl-conformance.sh

          - name: Codegen checks
            if: contains(matrix.suites, 'codegen')
            continue-on-error: ${{ matrix.suites != 'codegen' }}
            run: bash tests/codegen/run.sh build/spp

          - name: Differential suite
            if: contains(matrix.suites, 'differential')
            continue-on-error: ${{ matrix.suites != 'differential' }}
            run: bash tests/differential/run.sh build/spp

      - name: Upload coverage profiles
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prof-coverage-${{ strategy.job-index }}
          path: ${{ runner.temp }}/prof
          if-no-files-found: warn
          retention-days: 1

      - name: Upload test logs on failure
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testlog-coverage-${{ matrix.mode }}-shard${{ matrix.shard }}
          path: tests/gtest-parallel-logs
          if-no-files-found: ignore
          retention-days: 3

  # Waits on every cell, as it merges all their profiles.
  report:
    name: Report
    needs: [ build, test ]
    if: ${{ !cancelled() && needs.build.outputs.artifact != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id != '' && 'coverage-report' || '' }}
    steps:
      # Sudo installs llvm-profdata and llvm-cov.
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # The sources llvm-cov shows, at the commit the binaries were built from.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch and verify binaries
        uses: ./.github/actions/setup-runtime
        with:
          artifact: ${{ needs.build.outputs.artifact }}
          spp-sha256: ${{ needs.build.outputs.spp-sha256 }}
          tests-sha256: ${{ needs.build.outputs.tests-sha256 }}

      - name: Download coverage profiles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: prof-coverage-*
          path: ${{ runner.temp }}/prof
          merge-multiple: true

      - name: Install llvm-profdata and llvm-cov
        run: |
          bash .github/scripts/setup/fetch-llvm-sh.sh
          sudo "$RUNNER_TEMP/llvm.sh" "$LLVM_LIB_VERSION"

      - name: Merge and report
        run: bash .github/scripts/test/coverage-report.sh

      - name: Upload coverage report
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage/coverage.txt
            coverage/coverage.lcov
            coverage/report.txt
          if-no-files-found: error
          retention-days: 7
