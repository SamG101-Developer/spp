# Shares the release variant's build tree; Sonar only adds -DCMAKE_EXPORT_COMPILE_COMMANDS, which invalidates no
# objects, so the build below is just the configure step catching up.

name: sonar

on:
  workflow_call:
    inputs:
      build-type:
        required: false
        type: string
        default: "Release"
      os:
        description: "Must match the os the variant below was built on, or the build-tree cache never hits."
        required: false
        type: string
        default: "ubuntu-24.04"
      variant:
        description: "Build variant whose tree to restore. Must be one _lane.yaml actually builds on that os."
        required: false
        type: string
        default: "release"
      coverage-artifact:
        description: "A coverage lane's report artifact from this run, for the scan to read; none when empty."
        required: false
        type: string
        default: ""
    secrets:
      SONAR_TOKEN:
        required: true

permissions: { }

jobs:
  sonar:
    name: SonarQube Cloud
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python and load pins
        uses: ./.github/actions/setup-python

      - name: Restore source mtimes
        uses: ./.github/actions/restore-mtimes

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          runner-image: ${{ inputs.os }}
          compiler: gcc
          version: ${{ env.GCC_VERSION }}

      # The key comes from the same action the compile action
      # writes the tree with, so restoring it needs only the
      # variant name to agree.
      - name: Compose build tree cache key
        id: cache-key
        uses: ./.github/actions/build-cache-key
        with:
          os: ${{ inputs.os }}
          compiler: gcc
          version: ${{ env.GCC_VERSION }}
          variant: ${{ inputs.variant }}

      - name: Restore build tree
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}

      - name: Configure
        uses: ./.github/actions/configure-cmake
        with:
          build-type: ${{ inputs.build-type }}
          extra-flags: -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # Needed for the compile_commands.json the scanner reads, not
      # for the objects.
      - name: Build
        run: cmake --build build --parallel

      - name: Download coverage report
        if: inputs.coverage-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.coverage-artifact }}
          path: coverage

      # Run the sonar scanner action on the build tree.
      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: ${{ inputs.coverage-artifact != '' && '-Dsonar.cfamily.llvm-cov.reportPath=coverage/coverage.txt' || '' }}
