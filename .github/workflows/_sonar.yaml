name: sonar

# Shares the release variant's build tree; Sonar only adds -DCMAKE_EXPORT_COMPILE_COMMANDS, which invalidates no
# objects, so the build below is just the configure step catching up.

on:
  workflow_call:
    inputs:
      build-type:
        required: false
        type: string
        default: "Release"
      os:
        description: "Must match the os the variant below was built on, or the build-tree cache never hits."
        required: false
        type: string
        default: "ubuntu-24.04"
      variant:
        description: "Build variant whose tree to restore. Must be one _build.yaml actually builds on that os."
        required: false
        type: string
        default: "release-rel"
    secrets:
      SONAR_TOKEN:
        required: true

permissions: { }

jobs:
  sonar:
    name: SonarQube Cloud
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python and load pins
        uses: ./.github/actions/setup-python

      - name: Restore source mtimes
        uses: ./.github/actions/restore-mtimes

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          runner-image: ${{ inputs.os }}
          compiler: gcc
          version: ${{ env.GCC_VERSION }}
          cache-key-suffix: sonar

      # The key comes from the same action the compile action writes the tree with, so restoring it needs only the
      # variant name to agree.
      - name: Compose build tree cache key
        id: cache-key
        uses: ./.github/actions/build-cache-key
        with:
          os: ${{ inputs.os }}
          compiler: gcc
          version: ${{ env.GCC_VERSION }}
          variant: ${{ inputs.variant }}

      - name: Restore build tree
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}

      - name: Configure
        uses: ./.github/actions/configure-cmake
        with:
          build-type: ${{ inputs.build-type }}
          extra-flags: -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # Needed for the compile_commands.json the scanner reads, not for the objects.
      - name: Build
        run: cmake --build build --parallel

      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
