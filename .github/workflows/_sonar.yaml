name: sonar

on:
  workflow_call:
    inputs:
      build-type:
        required: false
        type: string
        default: "Release"
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # Lock down the workflow with the harden-runner action, as external packages or actions are fetched and executed.
      # This ensures better security in CI/CD pipeline.
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      # Provide capability to git-checkout external packages and actions. Anything done via this will be automatically
      # secured under the above "harden-runner" step. Sonar needs full history for its new-code / blame analysis, which
      # is also what the mtime restore below needs.
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore source mtimes
        uses: ./.github/actions/restore-mtimes

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          compiler: gcc
          version: "16"
          cache-key-suffix: sonar

      # Shares the release variant's tree; Sonar only adds -DCMAKE_EXPORT_COMPILE_COMMANDS, which does not invalidate
      # any objects.
      - name: Restore build tree
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build
          key: build-ubuntu-latest-gcc16-release-${{ github.sha }}
          restore-keys: |
            build-ubuntu-latest-gcc16-release-

      # Add the extra configuration flag into the cmake configuration (won't trigger a rebuild of the entire project).
      - name: Configure
        uses: ./.github/actions/configure-cmake
        with:
          build-type: ${{ inputs.build-type }}
          extra-flags: -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # Run the build script (won't rebuild anything, just covers the new flag being inserted)
      - name: Build
        run: cmake --build build --parallel

      # Perform the sonar scan to address all maintenance, reliability, security, etc issues.
      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
