name: sonar

on:
  workflow_call:
    inputs:
      build-type:
        required: false
        type: string
        default: "Release"
      os:
        description: "Must match the os the variant below was built on, or the build-tree cache never hits."
        required: false
        type: string
        default: "ubuntu-24.04"
      variant:
        description: "Build variant whose tree to restore. Must be one _compile.yaml actually builds on that os."
        required: false
        type: string
        default: "release-rel"
    secrets:
      SONAR_TOKEN:
        required: true

permissions: { }

jobs:
  sonar:
    name: SonarQube Cloud
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # Secure the runner from external packages or actions.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      # Provide the ability to git-checkout external packages and actions.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore source mtimes
        uses: ./.github/actions/restore-mtimes

      # setup-toolchain loads the manifest itself, but not until after its own `with:` has been evaluated, so the
      # loader runs here as well to put GCC_VERSION within reach of the step below and of the cache key further down.
      - name: Set up Python and load pins
        uses: ./.github/actions/setup-python

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          runner-image: ${{ inputs.os }}
          compiler: gcc
          version: ${{ env.GCC_VERSION }}
          cache-key-suffix: sonar

      # The key comes from the same action _compile.yaml writes the tree with, so restoring it needs only the variant
      # name to agree.
      - name: Compose build tree cache key
        id: cache-key
        uses: ./.github/actions/build-cache-key
        with:
          os: ${{ inputs.os }}
          compiler: gcc
          version: ${{ env.GCC_VERSION }}
          variant: ${{ inputs.variant }}

      # Shares the release variant's tree; Sonar only adds -DCMAKE_EXPORT_COMPILE_COMMANDS, which does not invalidate
      # any objects.
      - name: Restore build tree
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}

      # Add the extra configuration flag into the cmake configuration (won't trigger a rebuild of the entire project).
      - name: Configure
        uses: ./.github/actions/configure-cmake
        with:
          build-type: ${{ inputs.build-type }}
          extra-flags: -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # Run the build script (won't rebuild anything, just covers the new flag being inserted). This build is needed for
      # the `compile_commands.json` file to be generated, required for Sonar.
      - name: Build
        run: cmake --build build --parallel

      # Perform the sonar scan to address all maintenance, reliability, security, etc issues.
      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
