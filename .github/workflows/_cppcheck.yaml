name: cppcheck

# Static analysis gate. This sits between the cheap PR checks and the builds on purpose: it costs about half a minute
# once cppcheck is cached, and there is no sense spending build minutes across five toolchains on code that static
# analysis already rejects.

on:
  workflow_call: { }

permissions: { }

jobs:
  cppcheck:
    name: Static Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # upload the cppcheck SARIF
    steps:
      # Audit rather than block, deliberately. This job gates the builds, so an egress rule that turns out to be one
      # endpoint short would stop every merge rather than one job. Tighten it once the audit output for a cache-miss
      # run confirms what the cppcheck build actually reaches for.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python and load pins
        uses: ./.github/actions/setup-python

      # Keyed on the pinned commit and on the script that decides how it is built, so a change to either rebuilds and
      # anything else reuses the tree.
      - name: Cache cppcheck
        id: cppcheck-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.tools/cppcheck
          key: cppcheck-${{ runner.os }}-${{ env.CPPCHECK_COMMIT }}-${{ hashFiles('.github/dependencies.toml', '.github/scripts/lint/install-cppcheck.sh') }}

      # Only needed to build cppcheck itself, so both of these are skipped entirely on a cache hit. The runner's own
      # GCC compiles it; this job never configures the project, so no project toolchain is set up here.
      - name: Install CMake & Ninja (cache miss)
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: ${{ env.NINJA_VERSION }}

      - name: Build cppcheck (cache miss)
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/lint/install-cppcheck.sh

      - name: Expose cppcheck
        run: echo "$SPP_CPPCHECK_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Check version
        run: cppcheck --version

      # Findings fail the job. The rule selection and the reasoning behind it live in the script and in
      # .cppcheck-suppressions.
      - name: Run cppcheck
        run: bash .github/scripts/lint/run-cppcheck.sh cppcheck.sarif

      # continue-on-error because a pull request from a fork gets a read-only token: the upload would fail there and
      # take a merge gate down with it, and the findings are in the job log either way.
      - name: Upload cppcheck results
        if: always() && hashFiles('cppcheck.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e58424170fb0262c8d7ed60a2e84b9bffe205c67
        with:
          sarif_file: cppcheck.sarif
          category: cppcheck
