name: cppcheck

# Static analysis gate, between the cheap PR checks and the builds: about half a minute once cppcheck is cached,
# against a dozen toolchains spent on code it already rejects.

on:
  workflow_call: { }

permissions: { }

jobs:
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # upload the cppcheck SARIF
    steps:
      # Audit, not block: this job gates the builds, so an endpoint missing from the list would stop every merge.
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python and load pins
        uses: ./.github/actions/setup-python

      # Keyed on the pinned commit and the script that builds it, so a change to either rebuilds.
      - name: Cache cppcheck
        id: cppcheck-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.tools/cppcheck
          key: cppcheck-${{ runner.os }}-${{ env.CPPCHECK_COMMIT }}-${{ hashFiles('.github/dependencies.toml', '.github/scripts/lint/install-cppcheck.sh') }}

      # Only needed to build cppcheck itself: the runner's own GCC compiles it, and no project toolchain is set up.
      - name: Install CMake & Ninja (cache miss)
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: ${{ env.NINJA_VERSION }}

      - name: Build cppcheck (cache miss)
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/lint/install-cppcheck.sh

      - name: Expose cppcheck
        run: echo "$SPP_CPPCHECK_PREFIX/bin" >> "$GITHUB_PATH"

      # Findings fail the job. The rule selection lives in the script and in .cppcheck-suppressions.
      - name: Run cppcheck
        run: bash .github/scripts/lint/run-cppcheck.sh cppcheck.sarif

      # continue-on-error: a fork's PR gets a read-only token, and the findings are in the job log either way.
      - name: Upload cppcheck results
        if: always() && hashFiles('cppcheck.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e58424170fb0262c8d7ed60a2e84b9bffe205c67
        with:
          sarif_file: cppcheck.sarif
          category: cppcheck
