# One build, then one test matrix against its digest-checked
# binaries: gtest (mode x shard), STL conformance, and on Linux
# valgrind, the codegen checks and the differential suite when
# asked for, each in a cell of its own or, with `pack`, beside
# the last gtest shard.

name: lane

on:
  workflow_call:
    inputs:
      os:
        description: "Runner image; one listed under [runner] in .github/dependencies.toml."
        required: false
        type: string
        default: "ubuntu-24.04"
      compiler:
        description: "Compiler (gcc | clang | msvc | clang-cl); its version comes from the manifest."
        required: false
        type: string
        default: "gcc"
      variant:
        description: "Names the build tree's cache entry. Sonar restores it by this name."
        required: false
        type: string
        default: "release"
      build-type:
        required: false
        type: string
        default: "Release"
      modes:
        description: "Space-separated s++ modes (rel | dev) the gtest suite runs in, each against the same build."
        required: false
        type: string
        default: "rel dev"
      shard-count:
        description: "Jobs each mode's gtest sweep is split across."
        required: false
        type: number
        default: 4
      stl-conformance:
        description: "Run `spp init` / `spp build` / `spp test --all-libs` against the build."
        required: false
        type: boolean
        default: true
      valgrind:
        description: "Run chosen `!test` groups under valgrind (Linux only; advisory)."
        required: false
        type: boolean
        default: false
      codegen:
        description: "Run the tests/codegen hardening checks against the build (Linux only; advisory)."
        required: false
        type: boolean
        default: false
      differential:
        description: "Run the tests/differential programs at dev and rel and compare them (Linux only; advisory)."
        required: false
        type: boolean
        default: false
      pack:
        description: "Run STL conformance, valgrind, the codegen checks and the differential suite in the last gtest cell, in parallel with it, rather than in cells of their own."
        required: false
        type: boolean
        default: false
      check-floor:
        description: "Fail the build when its binaries need a newer system than [floor] in .github/dependencies.toml."
        required: false
        type: boolean
        default: false
      cmake-flags:
        description: "Extra CMake flags for the build, e.g. sanitizers. Give such a build its own variant."
        required: false
        type: string
        default: ""
      gtest-filter:
        description: "A --gtest_filter pattern for the gtest jobs; every test when empty."
        required: false
        type: string
        default: ""
      asan-options:
        description: "ASAN_OPTIONS for the gtest jobs of a sanitized build; ASan's defaults when empty."
        required: false
        type: string
        default: ""
      coverage:
        description: "Build with SPP_COVERAGE (clang only), collect every test cell's profiles, and report them."
        required: false
        type: boolean
        default: false
      advisory:
        description: "Let the lane fail without failing the run, for a toolchain not expected to work yet."
        required: false
        type: boolean
        default: false

    # The release collects each lane's staged spp by these, after
    # the whole lane - tests included - is green.
    outputs:
      artifact:
        description: "Name of the lane's staged binaries artifact."
        value: ${{ jobs.build.outputs.artifact }}
      spp-sha256:
        description: "sha256 of the staged spp."
        value: ${{ jobs.build.outputs.spp-sha256 }}
      tests-sha256:
        description: "sha256 of the staged spp_tests."
        value: ${{ jobs.build.outputs.tests-sha256 }}
      coverage-artifact:
        description: "Name of the coverage report artifact; empty unless coverage ran."
        value: ${{ jobs.coverage.outputs.artifact }}

permissions: { }

# Windows otherwise defaults `run` to PowerShell.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 120
    continue-on-error: ${{ inputs.advisory }}
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.compile.outputs.artifact }}
      tests: ${{ steps.plan.outputs.tests }}
      spp-sha256: ${{ steps.compile.outputs.spp-sha256 }}
      tests-sha256: ${{ steps.compile.outputs.tests-sha256 }}
    steps:
      # The action is Linux-only, so the Windows and macOS variants
      # go without it.
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # Full history: restore-mtimes walks it to date the sources for
      # the incremental build.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan the lane
        id: plan
        env:
          OS: ${{ inputs.os }}
          MODES: ${{ inputs.modes }}
          SHARD_COUNT: ${{ inputs.shard-count }}
          STL: ${{ inputs.stl-conformance }}
          VALGRIND: ${{ inputs.valgrind }}
          CODEGEN: ${{ inputs.codegen }}
          DIFFERENTIAL: ${{ inputs.differential }}
          PACK: ${{ inputs.pack }}
        run: bash .github/scripts/test/plan-tests.sh

      - name: Build
        id: compile
        uses: ./.github/actions/compile
        with:
          os: ${{ inputs.os }}
          compiler: ${{ inputs.compiler }}
          variant: ${{ inputs.variant }}
          build-type: ${{ inputs.build-type }}
          cmake-flags: ${{ inputs.cmake-flags }}${{ inputs.coverage && ' -DSPP_COVERAGE=ON' || '' }}
          check-floor: ${{ inputs.check-floor }}
          stage: true

  # Each cell is one suite; the planner decides which cells this
  # lane has, so a suite that does not apply draws no job at all.
  # Valgrind, the codegen checks and the differential suite are
  # advisory: valgrind and the differential suite until they have
  # run clean for a while, the codegen checks until they have on
  # the hosted kernel, which seal and deny_wx depend on.
  test:
    name: ${{ matrix.label }}
    needs: [ build ]
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.advisory || inputs.advisory }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.tests) }}
    steps:
      # Only valgrind needs sudo, for libc6-dbg, which valgrind
      # reads only from /usr/lib/debug. Egress stays on audit
      # until its endpoints are known.
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-sudo: ${{ !contains(matrix.suites, 'valgrind') }}

      # The test fixtures, at the same commit the binaries were built
      # from.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch and verify binaries
        uses: ./.github/actions/setup-runtime
        with:
          artifact: ${{ needs.build.outputs.artifact }}
          spp-sha256: ${{ needs.build.outputs.spp-sha256 }}
          tests-sha256: ${{ needs.build.outputs.tests-sha256 }}

      # Valgrind's set-up runs first, so its GITHUB_PATH write has
      # landed before the suites start. Valgrind is built into the
      # home directory.
      - name: Cache valgrind
        id: valgrind-cache
        if: contains(matrix.suites, 'valgrind')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tools/valgrind
          key: valgrind-${{ runner.os }}-${{ hashFiles('.github/dependencies.toml', '.github/scripts/lib/pins.py', '.github/scripts/setup/install-valgrind-linux.sh') }}

      - name: Install valgrind (cache miss)
        if: contains(matrix.suites, 'valgrind') && steps.valgrind-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/setup/install-valgrind-linux.sh

      - name: Expose valgrind
        if: contains(matrix.suites, 'valgrind')
        run: |
          echo "$SPP_VALGRIND_PREFIX/bin" >> "$GITHUB_PATH"
          "$SPP_VALGRIND_PREFIX/bin/valgrind" --version

      - name: Install glibc debug symbols
        if: contains(matrix.suites, 'valgrind')
        run: bash .github/scripts/setup/install-glibc-debuginfo-linux.sh

      # A merge pool: each binary's processes share 8 files rather than writing one each.
      - name: Collect coverage profiles
        if: inputs.coverage
        run: |
          mkdir -p "$RUNNER_TEMP/prof"
          echo "LLVM_PROFILE_FILE=$RUNNER_TEMP/prof/%8m.profraw" >> "$GITHUB_ENV"

      # Every suite the cell holds, side by side: a packed cell
      # (`pack`) lets the short suites finish while gtest runs on.
      # A failure fails the job at the group's implicit wait, after
      # the others have finished. Valgrind, the codegen checks and
      # the differential suite sharing a cell stay advisory through
      # their own continue-on-error; alone, the job-level one covers
      # them.
      - parallel:
          - name: Run tests
            id: tests
            if: contains(matrix.suites, 'gtest')
            uses: ./.github/actions/run-tests
            env:
              SPP_TEST_MODE: ${{ matrix.mode }}
              ASAN_OPTIONS: ${{ inputs.asan-options }}
            with:
              shard-count: ${{ inputs.shard-count }}
              shard-index: ${{ matrix.shard }}
              filter: ${{ inputs.gtest-filter }}

          - name: s++ STL conformance
            if: contains(matrix.suites, 'stl')
            run: bash .github/scripts/test/stl-conformance.sh

          # The compiled code's memory, over the groups that make
          # and drop frames, environments and buffers.
          - name: s++ test groups under valgrind
            if: contains(matrix.suites, 'valgrind')
            continue-on-error: ${{ matrix.suites != 'valgrind' }}
            run: bash .github/scripts/test/valgrind-groups.sh

          # What the compiler emits, built and run: canaries,
          # sealing, W^X, scrubbing, SLS, the abort path, ffi
          # unwinding and reproducibility, each against its key
          # turned off. cc, c++ and objdump are on the image.
          - name: Codegen checks
            if: contains(matrix.suites, 'codegen')
            continue-on-error: ${{ matrix.suites != 'codegen' }}
            run: bash tests/codegen/run.sh build/spp

          # Each program built at dev and at rel, run, and its
          # output and exit status compared.
          - name: Differential suite
            if: contains(matrix.suites, 'differential')
            continue-on-error: ${{ matrix.suites != 'differential' }}
            run: bash tests/differential/run.sh build/spp

      - name: Upload coverage profiles
        if: ${{ !cancelled() && inputs.coverage }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prof-${{ inputs.os }}-${{ inputs.variant }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/prof
          if-no-files-found: warn
          retention-days: 1

      - name: Upload test logs on failure
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testlog-${{ inputs.os }}-${{ inputs.compiler }}-${{ inputs.variant }}-${{ matrix.mode }}-shard${{ matrix.shard }}
          path: tests/gtest-parallel-logs
          if-no-files-found: ignore
          retention-days: 3

  # Whatever the test cells covered, failed cells included: a red
  # test still ran the code it reached.
  coverage:
    name: Coverage
    needs: [ build, test ]
    if: ${{ !cancelled() && inputs.coverage && needs.build.result == 'success' }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      # Sudo installs llvm-profdata and llvm-cov.
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # The sources llvm-cov shows, at the commit the binaries were built from.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch and verify binaries
        uses: ./.github/actions/setup-runtime
        with:
          artifact: ${{ needs.build.outputs.artifact }}
          spp-sha256: ${{ needs.build.outputs.spp-sha256 }}
          tests-sha256: ${{ needs.build.outputs.tests-sha256 }}

      - name: Download coverage profiles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: prof-${{ inputs.os }}-${{ inputs.variant }}-*
          path: ${{ runner.temp }}/prof
          merge-multiple: true

      - name: Install llvm-profdata and llvm-cov
        run: |
          bash .github/scripts/setup/fetch-llvm-sh.sh
          sudo "$RUNNER_TEMP/llvm.sh" "$LLVM_LIB_VERSION"

      - name: Merge and report
        run: bash .github/scripts/test/coverage-report.sh

      - name: Name the report
        id: name
        env:
          OS: ${{ inputs.os }}
          VARIANT: ${{ inputs.variant }}
        run: echo "artifact=coverage-${OS}-${VARIANT}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: |
            coverage/coverage.txt
            coverage/coverage.lcov
            coverage/report.txt
          if-no-files-found: error
          retention-days: 7
