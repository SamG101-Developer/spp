# One platform's lane, drawn as one box in the job graph: its
# build, staged as a digest-checked artifact, then the test
# matrix the build planned against it: gtest (mode x shard),
# STL conformance, and on Linux valgrind, the codegen checks and
# the differential suite when asked for, each in a cell of its
# own or, with `pack`, beside the last gtest shard. A failed
# build fails the lane, so a caller gating on the lane cannot
# mistake its skipped tests for a pass.

name: lane

on:
  workflow_call:
    inputs:
      os:
        description: "Runner image; one listed under [runner] in .github/dependencies.toml."
        required: false
        type: string
        default: "ubuntu-24.04"
      compiler:
        description: "Compiler (gcc | clang | msvc | clang-cl); its version comes from the manifest."
        required: false
        type: string
        default: "gcc"
      variant:
        description: "Names the build tree's cache entry. Sonar restores it by this name."
        required: false
        type: string
        default: "release"
      build-type:
        required: false
        type: string
        default: "Release"
      cmake-flags:
        description: "Extra CMake flags for the build, e.g. sanitizers. Give such a build its own variant."
        required: false
        type: string
        default: ""
      check-floor:
        description: "Fail the build when its binaries need a newer system than [floor] in .github/dependencies.toml."
        required: false
        type: boolean
        default: false
      modes:
        description: "Space-separated s++ modes (rel | dev) the gtest suite runs in, each against the same build."
        required: false
        type: string
        default: "rel"
      shard-count:
        description: "Jobs each mode's gtest sweep is split across."
        required: false
        type: number
        default: 1
      stl-conformance:
        description: "Run `spp init` / `spp build` / `spp test --all-libs` against the build."
        required: false
        type: boolean
        default: true
      valgrind:
        description: "Run chosen `!test` groups under valgrind (Linux only; advisory)."
        required: false
        type: boolean
        default: false
      codegen:
        description: "Run the tests/codegen hardening checks against the build (Linux only; advisory)."
        required: false
        type: boolean
        default: false
      differential:
        description: "Run the tests/differential programs at dev and rel and compare them (Linux only; advisory)."
        required: false
        type: boolean
        default: false
      pack:
        description: "Run STL conformance, valgrind, the codegen checks and the differential suite in the last gtest cell, in parallel with it, rather than in cells of their own."
        required: false
        type: boolean
        default: true
      advisory:
        description: "Let the build and its tests fail without failing the run, for a toolchain not expected to work yet."
        required: false
        type: boolean
        default: false
      gtest-filter:
        description: "A --gtest_filter pattern for the gtest cells; every test when empty."
        required: false
        type: string
        default: ""
      asan-options:
        description: "ASAN_OPTIONS for the gtest cells of a sanitized build; ASan's defaults when empty."
        required: false
        type: string
        default: ""
      off:
        description: "spp.toml keys STL conformance turns off; bare is [binary.codegen], else dotted."
        required: false
        type: string
        default: ""

    outputs:
      artifact:
        description: "Name of the lane's staged binaries artifact."
        value: ${{ jobs.build.outputs.artifact }}
      spp-sha256:
        description: "sha256 of the lane's staged spp."
        value: ${{ jobs.build.outputs.spp-sha256 }}
      tests-sha256:
        description: "sha256 of the lane's staged spp_tests."
        value: ${{ jobs.build.outputs.tests-sha256 }}

permissions: { }

# Windows otherwise defaults `run` to PowerShell.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 120
    continue-on-error: ${{ inputs.advisory }}
    permissions:
      contents: read
    outputs:
      tests: ${{ steps.build.outputs.tests }}
      artifact: ${{ steps.build.outputs.artifact }}
      spp-sha256: ${{ steps.build.outputs.spp-sha256 }}
      tests-sha256: ${{ steps.build.outputs.tests-sha256 }}
    steps:
      # The action is Linux-only, so the Windows and macOS variants
      # go without it.
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # Full history: restore-mtimes walks it to date the sources for
      # the incremental build.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and plan the tests
        id: build
        uses: ./.github/actions/build-and-plan
        with:
          os: ${{ inputs.os }}
          compiler: ${{ inputs.compiler }}
          variant: ${{ inputs.variant }}
          build-type: ${{ inputs.build-type }}
          cmake-flags: ${{ inputs.cmake-flags }}
          check-floor: ${{ inputs.check-floor }}
          modes: ${{ inputs.modes }}
          shard-count: ${{ inputs.shard-count }}
          stl-conformance: ${{ inputs.stl-conformance }}
          valgrind: ${{ inputs.valgrind }}
          codegen: ${{ inputs.codegen }}
          differential: ${{ inputs.differential }}
          pack: ${{ inputs.pack }}

  # Each cell is one suite; the planner decides which cells this
  # lane has, so a suite that does not apply draws no job at all.
  # Valgrind, the codegen checks and the differential suite are
  # advisory: valgrind and the differential suite until they have
  # run clean for a while, the codegen checks until they have on
  # the hosted kernel, which seal and deny_wx depend on.
  test:
    name: ${{ matrix.label }}
    needs: [ build ]
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.advisory || inputs.advisory }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.tests) }}
    steps:
      # Only valgrind needs sudo, for libc6-dbg, which valgrind
      # reads only from /usr/lib/debug. Egress stays on audit
      # until its endpoints are known.
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-sudo: ${{ !contains(matrix.suites, 'valgrind') }}

      # The test fixtures, at the same commit the binaries were built
      # from.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch and verify binaries
        uses: ./.github/actions/setup-runtime
        with:
          artifact: ${{ needs.build.outputs.artifact }}
          spp-sha256: ${{ needs.build.outputs.spp-sha256 }}
          tests-sha256: ${{ needs.build.outputs.tests-sha256 }}

      # Valgrind's set-up runs first, so its GITHUB_PATH write has
      # landed before the suites start. Valgrind is built into the
      # home directory.
      - name: Cache valgrind
        id: valgrind-cache
        if: contains(matrix.suites, 'valgrind')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tools/valgrind
          key: valgrind-${{ runner.os }}-${{ hashFiles('.github/dependencies.toml', '.github/scripts/lib/pins.py', '.github/scripts/setup/install-valgrind-linux.sh') }}

      - name: Install valgrind (cache miss)
        if: contains(matrix.suites, 'valgrind') && steps.valgrind-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/setup/install-valgrind-linux.sh

      - name: Expose valgrind
        if: contains(matrix.suites, 'valgrind')
        run: |
          echo "$SPP_VALGRIND_PREFIX/bin" >> "$GITHUB_PATH"
          "$SPP_VALGRIND_PREFIX/bin/valgrind" --version

      - name: Install glibc debug symbols
        if: contains(matrix.suites, 'valgrind')
        run: bash .github/scripts/setup/install-glibc-debuginfo-linux.sh

      # Every suite the cell holds, side by side: a packed cell
      # (`pack`) lets the short suites finish while gtest runs on.
      # A failure fails the job at the group's implicit wait, after
      # the others have finished. Valgrind, the codegen checks and
      # the differential suite sharing a cell stay advisory through
      # their own continue-on-error; alone, the job-level one covers
      # them. Not in a composite action: those cannot hold a
      # parallel group.
      - parallel:
          - name: Run tests
            id: tests
            if: contains(matrix.suites, 'gtest')
            uses: ./.github/actions/run-tests
            env:
              SPP_TEST_MODE: ${{ matrix.mode }}
              ASAN_OPTIONS: ${{ inputs.asan-options }}
            with:
              shard-count: ${{ matrix.shards }}
              shard-index: ${{ matrix.shard }}
              filter: ${{ inputs.gtest-filter }}

          - name: s++ STL conformance
            if: contains(matrix.suites, 'stl')
            env:
              SPP_OFF: ${{ inputs.off }}
            run: bash .github/scripts/test/stl-conformance.sh

          # The compiled code's memory, over the groups that make
          # and drop frames, environments and buffers.
          - name: s++ test groups under valgrind
            if: contains(matrix.suites, 'valgrind')
            continue-on-error: ${{ matrix.suites != 'valgrind' }}
            run: bash .github/scripts/test/valgrind-groups.sh

          # What the compiler emits, built and run: canaries,
          # sealing, W^X, scrubbing, SLS, the abort path, ffi
          # unwinding and reproducibility, each against its key
          # turned off. cc, c++ and objdump are on the image.
          - name: Codegen checks
            if: contains(matrix.suites, 'codegen')
            continue-on-error: ${{ matrix.suites != 'codegen' }}
            run: bash tests/codegen/run.sh build/spp

          # Each program built at dev and at rel, run, and its
          # output and exit status compared.
          - name: Differential suite
            if: contains(matrix.suites, 'differential')
            continue-on-error: ${{ matrix.suites != 'differential' }}
            run: bash tests/differential/run.sh build/spp

      - name: Upload test logs on failure
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testlog-${{ inputs.os }}-${{ inputs.compiler }}-${{ inputs.variant }}-${{ matrix.mode }}-shard${{ matrix.shard }}
          path: tests/gtest-parallel-logs
          if-no-files-found: ignore
          retention-days: 3
