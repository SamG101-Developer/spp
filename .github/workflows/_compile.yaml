name: compile

on:
  workflow_call:
    inputs:
      variants:
        description: >-
          JSON array of build variants. Each entry is
          {"name": "...", "build-type": "...", "sanitizer": "..."}; `sanitizer` may be "".
        required: true
        type: string
      os:
        description: "Runner image (ubuntu-latest | macos-latest | windows-latest)."
        required: false
        type: string
        default: "ubuntu-latest"
      compiler:
        description: "Compiler (gcc | clang | msvc | clang-cl)."
        required: false
        type: string
        default: "gcc"
      version:
        description: "Major version of the compiler; empty means the runner default."
        required: false
        type: string
        default: "16"
      fail-fast:
        description: "Cancel the sibling variants as soon as one fails."
        required: false
        type: boolean
        default: true
      run-tests:
        description: "Run the test suite after a successful build."
        required: false
        type: boolean
        default: true
      cache-build-tree:
        description: >-
          Restore and save the Ninja build tree. This is what makes CI incremental; turn it off
          for a variant whose tree is not worth its share of the 10 GB repository cache budget.
        required: false
        type: boolean
        default: true

jobs:
  compile:
    # The main compile jobs handles the cmake config + build, caching and incremental build management, and running the
    # tests against the built with upload of a failure log if any tests fail.
    name: ${{ inputs.compiler }}${{ inputs.version && format('-{0}', inputs.version) || '' }} · ${{ matrix.variant.name }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}

    env:
      # Inert for a non-sanitiser variant, so they are set unconditionally.
      ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:detect_leaks=1:strict_string_checks=1"
      UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
      TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
      CACHE_KEY: build-${{ inputs.os }}-${{ inputs.compiler }}${{ inputs.version }}-${{ matrix.variant.name }}

    steps:
      # Lock down the workflow with the harden-runner action, as external packages or actions are fetched and executed.
      # This ensures better security in CI/CD pipeline.
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      # Provide capability to git-checkout external packages and actions. Anything done via this will be automatically
      # secured under the above "harden-runner" step. Use fetch-depth 0 so mtimes can be reconstructed from history,
      # preventing full rebuild.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore source mtimes
        uses: ./.github/actions/restore-mtimes

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          compiler: ${{ inputs.compiler }}
          version: ${{ inputs.version }}
          cache-key-suffix: ${{ matrix.variant.name }}

      # Falls back to the newest tree for this variant on this branch, then on the base branch.
      - name: Restore build tree
        if: inputs.cache-build-tree
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build
          key: ${{ env.CACHE_KEY }}-${{ github.sha }}
          restore-keys: ${{ env.CACHE_KEY }}-

      # Launch the cmake configuration steps.
      - name: Configure
        uses: ./.github/actions/configure-cmake
        with:
          build-type: ${{ matrix.variant.build-type }}
          sanitizer: ${{ matrix.variant.sanitizer }}

      # Build the cmake project with the parallel flag set.
      - name: Build
        run: cmake --build build --parallel

      # Save the build tree to the cache.
      - name: Save build tree
        if: always() && inputs.cache-build-tree
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build
          key: ${{ env.CACHE_KEY }}-${{ github.sha }}

      # Launch the specialised parallel googletest script.
      - name: Run tests
        if: inputs.run-tests
        uses: ./.github/actions/run-tests

      # If any tests failed, then upload the log as an artefact so it can be downloaded for analysis.
      - name: Upload test logs on failure
        if: failure() && inputs.run-tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: testlog-${{ inputs.os }}-${{ inputs.compiler }}${{ inputs.version }}-${{ matrix.variant.name }}
          path: tests/test_output
          if-no-files-found: ignore
