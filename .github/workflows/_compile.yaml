name: compile

on:
  workflow_call:
    inputs:
      variants:
        description: >-
          JSON array of build variants. Each entry is
          {"name": "...", "build-type": "...", "sanitizer": "...", "spp-mode": "..."};
        required: true
        type: string
      os:
        description: "Runner image; one of the images listed under [runner] in .github/dependencies.toml."
        required: false
        type: string
        default: "ubuntu-24.04"
      compiler:
        description: "Compiler (gcc | clang | msvc | clang-cl)."
        required: false
        type: string
        default: "gcc"
      version:
        description: "Major version of the compiler; empty means the runner default."
        required: false
        type: string
        default: "16"
      fail-fast:
        description: "Cancel the sibling variants as soon as one fails."
        required: false
        type: boolean
        default: true
      run-tests:
        description: "Run the test suite after a successful build."
        required: false
        type: boolean
        default: true
      cache-build-tree:
        description: >-
          Restore and save the Ninja build tree. This is what makes CI incremental; turn it off
          for a variant whose tree is not worth its share of the 10 GB repository cache budget.
        required: false
        type: boolean
        default: true

permissions: { }

jobs:
  compile:
    # The main compilation jobs handles the cmake config +
    # build, caching and incremental build management, and
    # running the tests against the built with upload of a
    # failure log if any tests fail.
    name: ${{ inputs.os }} · ${{ inputs.compiler }}${{ inputs.version && format('-{0}', inputs.version) || '' }} · ${{ matrix.variant.name }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}

    env:
      # Inert for a non-sanitiser variant, so they are set
      # unconditionally.
      ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:detect_leaks=1:strict_string_checks=1"
      UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
      TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
      SPP_TEST_MODE: ${{ matrix.variant.spp-mode || 'rel' }}

    steps:
      # Secure the runner from external packages or actions.
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit

      # Provide the ability to git-checkout external packages
      # and actions.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore source mtimes
        uses: ./.github/actions/restore-mtimes

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          runner-image: ${{ inputs.os }}
          compiler: ${{ inputs.compiler }}
          version: ${{ inputs.version }}
          cache-key-suffix: ${{ matrix.variant.name }}

      # The key is composed by the shared action rather than
      # spelled out here, so the workflows that write the tree
      # and the ones that read it cannot drift apart.
      - name: Compose build tree cache key
        id: cache-key
        uses: ./.github/actions/build-cache-key
        with:
          os: ${{ inputs.os }}
          compiler: ${{ inputs.compiler }}
          version: ${{ inputs.version }}
          variant: ${{ matrix.variant.name }}

      # Falls back to the newest tree for this variant on this
      # branch, then on the base branch.
      - name: Restore build tree
        if: inputs.cache-build-tree
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}

      # Launch the cmake configuration steps.
      - name: Configure
        id: configure
        uses: ./.github/actions/configure-cmake
        with:
          build-type: ${{ matrix.variant.build-type }}
          sanitizer: ${{ matrix.variant.sanitizer }}

      # Build the cmake project with the parallel flag set. CI.
      # The output is teed so a failed build can be uploaded whole.
      - name: Build
        shell: bash
        run: |
          mkdir -p build-logs
          cmake --build build --parallel 2>&1 | tee build-logs/build.log

      # If the build failed, then upload the log as an artefact so
      # it can be downloaded for analysis.
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: buildlog-${{ inputs.os }}-${{ inputs.compiler }}${{ inputs.version }}-${{ matrix.variant.name }}
          path: build-logs
          if-no-files-found: ignore
          retention-days: 3

      # Save the build tree to the cache. A tree whose configure
      # failed is worse than no tree: its cached check results
      # come back on every later run.
      - name: Save build tree
        if: ${{ !cancelled() && inputs.cache-build-tree && steps.configure.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build
          key: ${{ steps.cache-key.outputs.key }}

      # Launch the specialised parallel googletest script.
      - name: Run tests
        if: inputs.run-tests
        uses: ./.github/actions/run-tests

      # If any tests failed, then upload the log as an artefact
      # so it can be downloaded for analysis.
      - name: Upload test logs on failure
        if: failure() && inputs.run-tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: testlog-${{ inputs.os }}-${{ inputs.compiler }}${{ inputs.version }}-${{ matrix.variant.name }}
          path: tests/test_output
          if-no-files-found: ignore
          retention-days: 3
