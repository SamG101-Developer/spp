name: compile

on:
  workflow_call:
    inputs:
      variant:
        description: "The build variant name."
        required: true
        type: string
      build-type:
        description: "CMake build type (Release | RelWithDebInfo | Debug)."
        required: true
        type: string
      sanitizer:
        description: "Sanitizers to instrument the compiler with, e.g. `address+undefined+leak`. Empty for none."
        required: false
        type: string
        default: ""
      spp-mode:
        description: "Optimisation pipeline the built compiler runs over the s++ fixtures (dev | rel)."
        required: false
        type: string
        default: "rel"
      shard-count:
        description: >-
          Total shards this variant's test sweep is split across, one call per shard. 1 runs the
          whole sweep in one job.
        required: false
        type: number
        default: 1
      shard-index:
        description: >-
          Zero-indexed shard this call runs. Shard 0 is the one that saves the build tree and
          stages the binary, so a sharded variant still writes each exactly once.
        required: false
        type: number
        default: 0
      stl-conformance:
        description: "Run the end-to-end `spp init` / `spp build` / `spp test --all-libs` sweep before the gtest suite."
        required: false
        type: boolean
        default: false
      os:
        description: "Runner image; one of the images listed under [runner] in .github/dependencies.toml."
        required: false
        type: string
        default: "ubuntu-24.04"
      compiler:
        description: "Compiler (gcc | clang | msvc | clang-cl)."
        required: false
        type: string
        default: "gcc"
      version:
        description: "Major version of the compiler; empty means the runner default."
        required: false
        type: string
        default: "16"
      run-tests:
        description: "Run the test suite after a successful build."
        required: false
        type: boolean
        default: true
      cache-build-tree:
        description: >-
          Restore and save the Ninja build tree. This is what makes CI incremental; turn it off
          for a variant whose tree is not worth its share of the 10 GB repository cache budget.
        required: false
        type: boolean
        default: true
      binary-artifact:
        description: >-
          Upload the built `spp` executable under this artifact name, renamed to match it. Empty means
          the binary is not kept.
        required: false
        type: string
        default: ""

permissions: { }

jobs:
  compile:
    # The main compilation jobs handles the cmake config +
    # build, caching and incremental build management, and
    # running the tests against the built with upload of a
    # failure log if any tests fail.
    name: ${{ inputs.os }} · ${{ inputs.compiler }}${{ inputs.version && format('-{0}', inputs.version) || '' }} · ${{ inputs.variant }}${{ inputs.shard-count > 1 && format(' · shard {0}', inputs.shard-index) || '' }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 120
    permissions:
      contents: read

    env:
      # Inert for a non-sanitiser variant, so they are set
      # unconditionally.
      ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:detect_leaks=1:strict_string_checks=1"
      UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
      TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
      SPP_TEST_MODE: ${{ inputs.spp-mode }}
      SPP_SHARD_SUFFIX: ${{ inputs.shard-count > 1 && format('-shard{0}', inputs.shard-index) || '' }}

    steps:
      # Secure the runner from external packages or actions.
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit

      # Provide the ability to git-checkout external packages
      # and actions.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore source mtimes
        uses: ./.github/actions/restore-mtimes

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          runner-image: ${{ inputs.os }}
          compiler: ${{ inputs.compiler }}
          version: ${{ inputs.version }}
          cache-key-suffix: ${{ inputs.variant }}

      # The key is composed by the shared action rather than
      # spelled out here, so the workflows that write the tree
      # and the ones that read it cannot drift apart.
      - name: Compose build tree cache key
        id: cache-key
        uses: ./.github/actions/build-cache-key
        with:
          os: ${{ inputs.os }}
          compiler: ${{ inputs.compiler }}
          version: ${{ inputs.version }}
          variant: ${{ inputs.variant }}

      # Falls back to the newest tree for this variant on this
      # branch, then on the base branch.
      - name: Restore build tree
        if: inputs.cache-build-tree
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}

      # Launch the cmake configuration steps.
      - name: Configure
        id: configure
        uses: ./.github/actions/configure-cmake
        with:
          build-type: ${{ inputs.build-type }}
          sanitizer: ${{ inputs.sanitizer }}

      # Build the cmake project with the parallel flag set. CI.
      # The output is teed so a failed build can be uploaded whole.
      - name: Build
        shell: bash
        run: |
          mkdir -p build-logs
          cmake --build build --parallel 2>&1 | tee build-logs/build.log

      # If the build failed, then upload the log as an artefact so
      # it can be downloaded for analysis.
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: buildlog-${{ inputs.os }}-${{ inputs.compiler }}${{ inputs.version }}-${{ inputs.variant }}${{ env.SPP_SHARD_SUFFIX }}
          path: build-logs
          if-no-files-found: ignore
          retention-days: 3

      # Save the build tree to the cache. A tree whose configure
      # failed is worse than no tree: its cached check results
      # come back on every later run, so the configure gate is
      # the whole of the check.
      - name: Save build tree
        if: ${{ always() && inputs.cache-build-tree && steps.configure.outcome == 'success' && !inputs.shard-index }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build
          key: ${{ steps.cache-key.outputs.key }}

      # Named on the way out rather than on the way in, so the artifact and the file inside it carry the same
      # release-identifying name and the publish step can attach them without a rename.
      - name: Stage binary for release
        if: inputs.binary-artifact != '' && !inputs.shard-index
        shell: bash
        env:
          ARTIFACT: ${{ inputs.binary-artifact }}
        run: |
          mkdir -p staged
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/spp.exe "staged/${ARTIFACT}.exe"
          else
            cp build/spp "staged/${ARTIFACT}"
          fi

      - name: Upload binary
        if: inputs.binary-artifact != '' && !inputs.shard-index
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.binary-artifact }}
          path: staged
          if-no-files-found: error
          retention-days: 7

      # Takes a project from nothing - `spp init`, `spp build`,
      # `spp test --all-libs` - and so covers the STL, which
      # the gtest suite never links or executes.
      - name: s++ STL conformance
        if: inputs.run-tests && inputs.stl-conformance
        shell: bash
        run: bash .github/scripts/stl-conformance/run.sh

      # Launch the specialised parallel googletest script.
      - name: Run tests
        if: inputs.run-tests
        uses: ./.github/actions/run-tests
        with:
          shard-count: ${{ inputs.shard-count }}
          shard-index: ${{ inputs.shard-index }}

      # If any tests failed, then upload the log as an artefact
      # so it can be downloaded for analysis.
      - name: Upload test logs on failure
        if: failure() && inputs.run-tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: testlog-${{ inputs.os }}-${{ inputs.compiler }}${{ inputs.version }}-${{ inputs.variant }}${{ env.SPP_SHARD_SUFFIX }}
          path: tests/test_output
          if-no-files-found: ignore
          retention-days: 3
