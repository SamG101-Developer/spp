# Split out of _security.yaml so it can sit behind cppcheck
# without holding the cheap scans up: it builds the whole
# project under its extractor, which makes it the one
# security job worth gating on something faster.
name: codeql

on:
  workflow_call:
    inputs:
      full-scan:
        description: "Run a full security scan (security-and-quality rather than security-extended)."
        required: false
        type: boolean
        default: false

permissions: { }

jobs:
  codeql:
    name: C/C++
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read          # checkout
      security-events: write  # upload CodeQL results
      actions: read           # read workflow run metadata (private repos)
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python and load pins
        uses: ./.github/actions/setup-python

      # Tracks the manifest's GCC rather than naming a compiler
      # of its own. No compiler cache: a hit skips the real
      # compiler, and the extractor never sees the translation
      # unit.
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          runner-image: ubuntu-24.04
          compiler: gcc
          version: ${{ env.GCC_VERSION }}
          compiler-cache: "false"

      # Get CodeQL ready, from their own action. Specify the C++
      # language, the config file, and queries to run.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: c-cpp
          build-mode: manual
          config-file: ./.github/codeql-config.yaml
          queries: ${{ inputs.full-scan && 'security-and-quality' || 'security-extended' }}

      # Configure a Debug build, and build it.
      - name: Configure
        uses: ./.github/actions/configure-cmake
        with:
          build-type: Debug

      - name: Build
        run: cmake --build build --parallel

      # Run the CodeQL analysis action, which will upload the
      # results too.
      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:c-cpp"
