[[library]]
name = "googletest"
repo = "https://github.com/SamG101-Developer/googletest.git"
commit = "2dc53710d79c49d58bc3d7bdbfc5c0e09cef1361"

[[library]]
name = "ColEx"
repo = "https://github.com/SamG101-Developer/ColEx.git"
commit = "badae2b5e668084412cef496283a345bd8bd9744"

[[library]]
name = "GenEx"
repo = "https://github.com/SamG101-Developer/GenEx.git"
commit = "3a267d801cb7a2b647256ffa93bd203c7083dae0"

[[library]]
name = "NumEx"
repo = "https://github.com/SamG101-Developer/NumEx.git"
commit = "6e20c779c7508456afc5e928005b1f687109ac2a"
cmake-flags = ["-DNUMEX_BUILD_TESTS=OFF", "-DNUMEX_BUILD_BENCHMARKS=OFF"]
