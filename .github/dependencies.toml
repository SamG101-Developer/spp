# Every version, commit and digest the pipeline depends on. Loaded by .github/scripts/lib/pins.py and refreshed by
# .github/scripts/maint/refresh-pins.sh.
#
# Each [pin.<name>] table exports its version/commit/tag/asset/sha256 keys into the job environment as
# <NAME>_<KEY>, uppercased with dashes as underscores: pin.osv-scanner.sha256 becomes OSV_SCANNER_SHA256.

[pin.gcc]
version = "16.2"

[pin.cmake]
version = "4.5.0-rc3"

[pin.ninja]
version = "1.13.2"

[pin.python]
version = "3.14"

[pin.llvm-lib]
version = "23"

# apt.llvm.org's installer, fetched and then run as root
# by the Clang and LLVM steps.
[pin.llvm-sh]
sha256 = "03878e08f47b66cc95bc4b544b0db3c6d9ce8d60e6cf2492ae357984330a9eae"

# Refreshed to the newest final release of the [pin.llvm-lib]
# major. macOS takes brew's llvm instead (built with RTTI).
[pin.llvm-win]
tag = "llvmorg-23.1.5"
asset = "clang+llvm-23.1.5-x86_64-pc-windows-msvc.tar.xz"
sha256 = "62fdada7f6fa2b73856486dfbbdba3d2c1882991621615bcb55c60207611c6d4"

# The same release for the windows-11-arm runner.
[pin.llvm-win-arm]
tag = "llvmorg-23.1.5"
asset = "clang+llvm-23.1.5-aarch64-pc-windows-msvc.tar.xz"
sha256 = "f06382f2c99c68a4e80f7044446df1fcf52bc3cc05158626bd0b966d51a5369a"

# That Windows release names ZLIB::ZLIB, zstd::libzstd_static
# and LibXml2::LibXml2 in its exported targets, and the runner
# image has none of the three to resolve them with. Built from
# source by install-llvm-deps-windows.sh. Pinned to release tags
# rather than HEAD, so refresh-pins.sh leaves them alone.
[pin.zlib]
version = "1.3.1"
commit = "51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf"

[pin.zstd]
version = "1.5.7"
commit = "f8745da6ff1ad1e7bab384bd1f9d742439278e99"

[pin.libxml2]
version = "2.15.3"
commit = "c94eb0210183b9d7cb43f8e7fddc6be55843ef49"

# The <pthread.h> that MSVC does not ship, for pthread.ixx to wrap.
# Pinned to this fork's HEAD: the release tags predate its CMake config.
[pin.pthreads4w]
version = "3.0.3"
commit = "06e7608bfe926d2bd7176c0b02be0c98f40cced4"

# macOS toolchains are tied to the Xcode app on the runner image.
# Pin the developer directory explicitly so CI does not drift when GitHub updates the image. One key per image,
# because images do not share a default Xcode (macos-26 boots on 26.6). refresh-pins.sh reports a newer image
# default or a pin the image dropped, but never moves these.
[pin.xcode]
developer-dir-macos-26 = "/Applications/Xcode_26.6.app/Contents/Developer"

# Rust for the run-time benchmarks' comparison programs: the standalone
# rustc and rust-std component tarballs, so the version is ours rather
# than rustup's. Its LLVM major should match [pin.llvm-lib], as the
# comparison is of the IR each frontend hands the same LLVM.
[pin.rust]
version = "1.100.0"
sha256-rustc = "f1d0b1dec81dab6f523cd098507763487b0d4bd7fd2c87582f154128719be03b"
sha256-rust-std = "4591b6486594ded52ecd6135db95bf9355bbd3ca7a380888b141528bbcf9a5d4"

[pin.doxygen]
version = "1.17.0"
sha256 = "75419ef4f446fc1c24ef12514b574e66e898ee6f527c6ae2ad84f91a905823c2"

# Built from the release tarball: the runner's apt valgrind trails
# upstream by years.
[pin.valgrind]
version = "3.28.0"
sha256 = "9f7a18d128f05d3a80fea53e6953f34aad7200a425ceaee46099a8a798a7dd9c"

# Built from the release tarball, with Python for the std's
# pretty-printers: the runner image has no gdb, and apt's trails
# upstream by years. The codegen checks read variables with it.
[pin.gdb]
version = "18.1"
sha256 = "cd9fc3fe2b47743840e42c1592d3d87f8302eb18639c0b8b4ba0898002e2348f"

[pin.qemu-user]
tag = "spp-2026.11.09.3"
sha256 = "64e805c66d9f64d9d1bedd6dc44b280ee8dc1e5aa7237f606b467a27481705f7"

[pin.arm-gnu]
version = "15.3.rel2"
sha256-aarch64-be = "bdf8e9b4c62791c5c3aeeb8ba3791421d73c7d147dd04f0da502716885bcc1d2"

[pin.alpine]
version = "3.24.4"
sha256 = "f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf"

# Executed by python3 against the built test binary,
# so pinned by commit.
[pin.gtest-parallel]
commit = "cd488bdedc1d2cffb98201a17afc1b298b0b90f1"

# Tools the pipeline runs, tracking published releases
# rather than a branch tip.
[pin.ccache]
version = "4.14.3"
sha256-linux-x86-64 = "e4583fd653b794a480b9915358679a75cdd7a7010dd865eaf4cbdc61e665a3f0"
sha256-linux-aarch64 = "4b0ecece7929cbaf548ff1ab9a24074b240132ab8176bc3865a27d88c457a0d8"
sha256-darwin = "764dd2a8100ff83e6bbd7b9a1e2016cc401be34bee8a70ea99698186622c34d5"

[pin.sccache]
version = "0.19.0"
sha256-x86-64 = "130e4f8eb672e76590e9993c2ab890c4763b88238577bb11d8062158c7698353"
sha256-aarch64 = "a680e8e6058b033cd6ff56d56b2219ca13f1c1a45f50fb3b04f4ed80851f5c2b"

[pin.osv-scanner]
version = "2.7.1"
sha256 = "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8"

# Keep the version in step with the gitleaks rev in
# .pre-commit-config.yaml.
[pin.gitleaks]
version = "8.30.1"
sha256 = "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

# Built from source: distro packages are years behind and
# cannot parse C++20 modules. Pinned by commit because
# GitHub's generated tag archives are not byte-stable.
[pin.cppcheck]
version = "2.22.0"
commit = "a436ca35ed1887bee789765122b65ed2d7a7e045"

[runner]
linux = "ubuntu-24.04"
linux-arm = "ubuntu-24.04-arm"
macos = "macos-26"
windows = "windows-2025"
windows-vs2026 = "windows-2025-vs2026"
windows-arm = "windows-11-arm"

[floor]
glibc = "2.28"
linux = "4.18"
binutils = "2.30"
macos = "26.0"

# Install prefixes, exported as SPP_CI_<KEY>_PREFIX. {home} expands at load time.
[prefix]
local = "{home}/.local"
doxygen = "{home}/.tools/doxygen"
valgrind = "{home}/.tools/valgrind"
gdb = "{home}/.tools/gdb"
rust = "{home}/.tools/rust"
qemu = "{home}/.tools/qemu"
llvm-win = "{home}/llvm"
llvm-mac = "{home}/llvm"
llvm-deps-win = "{home}/llvm-deps"
cppcheck = "{home}/.tools/cppcheck"

[cache.build]
generation = "v3"

# The header/CMake dependencies, installed in order by
# install-small-libs.sh.
[[library]]
name = "unordered_dense"
repo = "https://github.com/martinus/unordered_dense.git"
commit = "bcc2bb5801fb920a1df06a2ee205b93b2514964e"

