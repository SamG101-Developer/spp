repo = "https://github.com/ashvardanian/stringzilla.git"
commit = "3cd0f9bcab97912dd36ca4ca4253f1f46b33ef8e"
cmake-flags = [
  "-DSTRINGZILLA_INSTALL=ON",
  "-DSTRINGZILLA_BUILD_TEST=OFF",
  "-DSTRINGZILLA_BUILD_BENCHMARK=OFF",
  "-DSTRINGZILLA_BUILD_SHARED=OFF",
  "-DSTRINGZILLAS_BUILD_SHARED=OFF",
  "-DSTRINGZILLA_BUILD_CUDA=OFF",
]

[[library]]
name = "small_vector"
repo = "https://github.com/gharveymn/small_vector.git"
commit = "efcab60e5360b699f45d2a44dcb9a79bba40c356"
cmake-flags = [
  "-DGCH_SMALL_VECTOR_ENABLE_TESTS=OFF",
  "-DGCH_SMALL_VECTOR_ENABLE_BENCHMARKS=OFF",
]

[[library]]
name = "CLI11"
repo = "https://github.com/CLIUtils/CLI11.git"
commit = "1764a057b760e8873eab03f4635b4aaed5303a04"
cmake-flags = ["-DCLI11_BUILD_TESTS=OFF", "-DCLI11_BUILD_EXAMPLES=OFF"]

[[library]]
name = "range-v3"
repo = "https://github.com/ericniebler/range-v3.git"
commit = "5ba39112d2eafbb3c851a16a537f29b445022998"
cmake-flags = [
  "-DRANGE_V3_TESTS=OFF",
  "-DRANGE_V3_EXAMPLES=OFF",
  "-DRANGE_V3_DOCS=OFF",
