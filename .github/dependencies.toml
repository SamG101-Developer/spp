# Every version, commit and digest the pipeline depends on. Loaded by .github/scripts/lib/pins.py and refreshed by
# .github/scripts/maint/refresh-pins.sh.
#
# Each [pin.<name>] table exports its version/commit/tag/asset/sha256 keys into the job environment as
# <NAME>_<KEY>, uppercased with dashes as underscores: pin.osv-scanner.sha256 becomes OSV_SCANNER_SHA256.

[pin.gcc]
version = "16.2"

[pin.cmake]
version = "4.4.0"

[pin.ninja]
version = "1.13.2"

[pin.python]
version = "3.14"

[pin.llvm-lib]
version = "23"

# apt.llvm.org's installer, fetched and then run as root
# by the Clang and LLVM steps.
[pin.llvm-sh]
sha256 = "03878e08f47b66cc95bc4b544b0db3c6d9ce8d60e6cf2492ae357984330a9eae"

# The asset name is not derivable from the tag:
# llvmorg-23.1.0-rc3 ships clang+llvm-23.0.0.3-*.
[pin.llvm-win]
tag = "llvmorg-23.1.0-rc3"
asset = "clang+llvm-23.0.0.3-x86_64-pc-windows-msvc.tar.xz"
sha256 = "9465632c6d96e65ab6b7f6fbf7ae447621803982b2348483221812bbf4c8b6af"

# That Windows release names ZLIB::ZLIB, zstd::libzstd_static
# and LibXml2::LibXml2 in its exported targets, and the runner
# image has none of the three to resolve them with. Built from
# source by install-llvm-deps-windows.sh. Pinned to release tags
# rather than HEAD, so refresh-pins.sh leaves them alone.
[pin.zlib]
version = "1.3.1"
commit = "51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf"

[pin.zstd]
version = "1.5.7"
commit = "f8745da6ff1ad1e7bab384bd1f9d742439278e99"

[pin.libxml2]
version = "2.15.3"
commit = "c94eb0210183b9d7cb43f8e7fddc6be55843ef49"

# The <pthread.h> that MSVC does not ship, for pthread.ixx to wrap.
# Pinned to this fork's HEAD: the release tags predate its CMake config.
[pin.pthreads4w]
version = "3.0.3"
commit = "06e7608bfe926d2bd7176c0b02be0c98f40cced4"

# Homebrew has no llvm@23 formula (llvm is still 22.1.x), so
# macOS takes its whole toolchain - compiler, libc++ and dev
# libraries - off the same release as Windows.
[pin.llvm-mac]
tag = "llvmorg-23.1.0-rc3"
asset = "LLVM-23.1.0-rc3-macOS-ARM64.tar.xz"
sha256 = "d23dc0baf29225e2975447f29bbc98b4fc3779001e91adc4a5d7d95854681e79"

# macOS toolchains are tied to the Xcode app on the runner image.
# Pin the developer directory explicitly so CI does not drift when GitHub updates the image. One key per image,
# because the two do not overlap at the default: macos-15 boots on 16.4 and macos-26 on 26.6.
[pin.xcode]
developer-dir-macos-15 = "/Applications/Xcode_16.4.app/Contents/Developer"
developer-dir-macos-26 = "/Applications/Xcode_26.6.app/Contents/Developer"

[pin.doxygen]
version = "1.17.0"
sha256 = "75419ef4f446fc1c24ef12514b574e66e898ee6f527c6ae2ad84f91a905823c2"

# Built from the release tarball: the runner's apt valgrind trails
# upstream by years.
[pin.valgrind]
version = "3.28.0"
sha256 = "9f7a18d128f05d3a80fea53e6953f34aad7200a425ceaee46099a8a798a7dd9c"

[pin.qemu-user]
version = "11.1.2+ds-3"
sha256 = "4bacc2bf647f1756c5f08e7f146161d3eeef9d9f53e5d6412d1b3daca0c93655"

[pin.alpine]
version = "3.24.3"
sha256 = "be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a"

# Executed by python3 against the built test binary,
# so pinned by commit.
[pin.gtest-parallel]
commit = "cd488bdedc1d2cffb98201a17afc1b298b0b90f1"

# Tools the pipeline runs, tracking published releases
# rather than a branch tip.
[pin.ccache]
version = "4.14.2"
sha256-linux-x86-64 = "d540ba01f160addbd3dd5e18eda9bd34005591b095c09ac8ae9d0a1b655e7ef5"
sha256-linux-aarch64 = "2be524bbccfc7e9ff0085d110da7dc9964de983bd92d29acf3b872e557194945"
sha256-darwin = "cf240009630b605b775c7c5c7b7105a3b196c79f31af322c1557969aa28003fc"

[pin.sccache]
version = "0.19.0"
sha256 = "130e4f8eb672e76590e9993c2ab890c4763b88238577bb11d8062158c7698353"

[pin.osv-scanner]
version = "2.7.0"
sha256 = "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"

# Keep the version in step with the gitleaks rev in
# .pre-commit-config.yaml.
[pin.gitleaks]
version = "8.30.1"
sha256 = "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

# Built from source: distro packages are years behind and
# cannot parse C++20 modules. Pinned by commit because
# GitHub's generated tag archives are not byte-stable.
[pin.cppcheck]
version = "2.22.0"
commit = "a436ca35ed1887bee789765122b65ed2d7a7e045"

[runner]
linux = "ubuntu-24.04"
linux-arm = "ubuntu-24.04-arm"
linux-old = "ubuntu-22.04"
linux-old-arm = "ubuntu-22.04-arm"
macos = "macos-26"
macos-old = "macos-15"
windows = "windows-2025"
windows-old = "windows-2022"

[floor]
glibc = "2.28"
linux = "4.18"
binutils = "2.30"
macos = "11.0"

# Install prefixes, exported as SPP_<KEY>_PREFIX. {home} expands at load time.
[prefix]
local = "{home}/.local"
doxygen = "{home}/.tools/doxygen"
valgrind = "{home}/.tools/valgrind"
qemu = "{home}/.tools/qemu"
llvm-win = "{home}/llvm"
llvm-mac = "{home}/llvm"
llvm-deps-win = "{home}/llvm-deps"
cppcheck = "{home}/.tools/cppcheck"

[cache.build]
generation = "v3"

# The header/CMake dependencies, installed in order by
# install-small-libs.sh.
[[library]]
name = "unordered_dense"
repo = "https://github.com/martinus/unordered_dense.git"
commit = "7c58a8b7a48e790fe72f6508eb3b46317cbba9d5"

[[library]]
name = "mimalloc"
repo = "https://github.com/microsoft/mimalloc.git"
commit = "8b08dbb8f9c8db7f01e9abe5b1a981d985e1fa46"
cmake-flags = ["-DMI_SECURE=OFF", "-DMI_BUILD_TESTS=OFF"]
cmake-flags-windows = ["-DMI_OVERRIDE=OFF"]

[[library]]
name = "json"
repo = "https://github.com/nlohmann/json.git"
commit = "2a56afc714d485870ae41cb1ac4fb0556f86726b"
cmake-flags = ["-DJSON_BuildTests=OFF"]

[[library]]
name = "tomlplusplus"
repo = "https://github.com/marzer/tomlplusplus.git"
commit = "1e8829b793b66ad17011732a146b8077d379b011"

[[library]]
name = "magic_enum"
repo = "https://github.com/Neargye/magic_enum.git"
commit = "5de969c9005938a27a34d3af3ea5923d18679ad8"
cmake-flags = [
  "-DMAGIC_ENUM_OPT_BUILD_TESTS=OFF",
  "-DMAGIC_ENUM_OPT_BUILD_EXAMPLES=OFF",
